## Globally shared configuration for authentik components.
global:
  image:
    repository: hub.nexdev.net/base/goauthentik/server
    tag: "2025.10.1"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

## authentik server
server:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # securityContext:
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 1000
    # ingress:
    #     # Specify kubernetes ingress controller class name
    #     ingressClassName: nginx
    #     enabled: true
    #     hosts:
    #         - authentik.nexdev.net

## authentik worker
worker:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

