---
controller:
  kind: DaemonSet
  config:
    ssl-certificate: "haproxy-ingress/ops-klprod-cert"
    stats-config-snippet: |
      stats auth lumi:lum!onRock
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 46
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
      capture request header X-Actual-Ip len 20
      acl is_cluster path -i /cluster-name
      http-request return status 200 content-type "text/plain" string "KLPROD" if is_cluster
    backend-config-snippet: |
      option forwardfor if-none

    timeout-connect: "5s"
    scale-server-slots: "7"
    maxconn: "20000"
    forwarded-for: "true"
    dontlognull: "true"

  extraArgs:
    - --disable-ipv6
    - --configmap-errorfiles=haproxy-ingress/errorfile

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Cluster"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]

    nodePorts:
      http: 31080
      https: 31443
      stat: 31024
    
    tcpPorts:
      - name: http-office
        port: 8088
        targetPort: http
        nodePort: 31088

  logging:
    level: info
    # traffic:
    #   address: "stdout"
    #   format: "raw"
    #   facility: "daemon"
    # traffic:
    #   address: "logstash.ops-klprod.gamora.prod"
    #   port: "30045"
    #   format: "rfc3164"
    #   facility: "local7"
    traffic:
      address: "flb.ops-klprod.gamora.prod"
      port: "31170"
      format: "rfc5424"
      facility: "local1"
      length: "65535"

  nodeSelector:
    node-role.kubernetes.io/ingress: ""
    node-role.kubernetes.io/worker: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/ingress


  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

  image:
    repository: "hub.lumigame.com/base/haproxytech/kubernetes-ingress"

defaultBackend:
  image: "hub.lumigame.com/base/nexops-tools/default-backend-ingress"

clusterInfo: "k8s-sc-prod"

extraResources:
##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    rules:
    - host: stats-sc.starixplay.com
      http:
        paths:
        - backend:
            service:
              name: {{ include "kubernetes-ingress.fullname" . }}
              port:
                number: 1024
          path: /
          pathType: Prefix
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          env:
          - name: CLUSTER_NAME
            value: {{ .Values.clusterInfo }}
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    selector:
      app: nexops

## Config Map 503 Page
- |
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: errorfile
    namespace: haproxy-ingress
  data:
    503: |-
      HTTP/1.1 503 Service Unavailable
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Service Unavailable</title>
          <!-- Cluster: {{ .Values.clusterInfo }} -->
          <style>
              body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background-color: #f8f9fa;
                  color: #343a40;
                  margin: 0;
                  padding: 0;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
              }
              .container {
                  background-color: white;
                  padding: 2rem;
                  border-radius: 12px;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                  max-width: 600px;
                  width: 90%;
                  text-align: center;
              }
              .main-message {
                  font-size: 1.8rem;
                  font-weight: 600;
                  margin-bottom: 1rem;
                  color: #333;
              }
              .sub-message {
                  font-size: 1.1rem;
                  line-height: 1.5;
                  color: #666;
                  margin-bottom: 1.5rem;
              }
              .help-box {
                  background-color: #f1f3f5;
                  padding: 1.5rem;
                  border-radius: 8px;
                  margin: 1.5rem 0;
                  text-align: left;
              }
              .help-title {
                  font-weight: 600;
                  margin-bottom: 0.5rem;
                  color: #444;
              }
              .cluster-info {
                  position: fixed;
                  bottom: 10px;
                  right: 10px;
                  font-size: 0.7rem;
                  color: #aaa;
                  opacity: 0.5;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <h1 class="main-message">Service Unavailable</h1>
              <p class="sub-message">The server is currently unable to handle the request due to a temporary overload or maintenance. Please try again later.</p>
              
              <div class="help-box">
                  <p class="help-title">What you can do</p>
                  <ul>
                      <li>Wait a few minutes and refresh the page</li>
                      <li>Check your network connection</li>
                      <li>Contact the website administrator if the problem persists</li>
                  </ul>
              </div>
          </div>
      </body>
      </html>
