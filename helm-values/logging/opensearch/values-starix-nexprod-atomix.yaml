---
image:
  repository: "hub.nexdev.net/base/opensearchproject/opensearch"
  
singleNode: true

extraEnvs:
- name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  value: Y8cY3sn7hCwSmJLff2U7fkNG

opensearchJavaOpts: "-Xmx4G -Xms4G"

persistence:
  storageClass: longhorn
  size: 30Gi

ingress:
  enabled: true
  ingressClassName: haproxy
  hosts:
  - opsi.nexdev.net
  annotations:
    haproxy.org/server-ssl: 'true'

resources:
  requests:
    cpu: "4"
    memory: "6Gi"

plugins:
  enabled: true
  installList:
  - https://s3-api.starixsoft.com/awx-install/prometheus-exporter-2.19.2.zip

serviceMonitor:
  enabled: true
  scheme: https
  internal: 30s
  tlsConfig:
    insecureSkipVerify: true
  basicAuth:
    enabled: true
    existingSecret: opensearch-cluster-master-service-monitor-credentials
