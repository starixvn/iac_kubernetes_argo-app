image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit
  tag: 4.0.3-geoip

# nodeSelector:
#   node-role.kubernetes.io/control-plane: ""
#   node-role.kubernetes.io/master: ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations:
- operator: Exists

extraPorts:
- port: 5170
  containerPort: 5170
  protocol: UDP
  name: syslog

config:
  inputs: |
    [INPUT]
      Name tail
      Path /var/log/containers/calico*.log,/var/log/containers/dns*.log,/var/log/containers/kube*.log,/var/log/containers/nodelocaldns*.log
      multiline.parser docker, cri
      Tag kube.kubesystem
      Mem_Buf_Limit 64MB
      Skip_Long_Lines On

    [INPUT]
      Name systemd
      Tag host.kubesystem
      Systemd_Filter _SYSTEMD_UNIT=containerd.service
      Systemd_Filter _SYSTEMD_UNIT=etcd.service
      Systemd_Filter _SYSTEMD_UNIT=kubelet.service
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name systemd
      Tag host.all
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name syslog
      Tag syslog.haproxy
      Listen 0.0.0.0
      Port 5170
      Mode udp
      Source_Address_Key host
      
  filters: |
    [FILTER]
      Name modify
      Match *
      Add env prod
      Add region kl
      Add team pentagon
      Add engine k8s

    [FILTER]
      Name kubernetes
      Match kube.*
      Kube_Tag_Prefix kube.containers.
      Merge_Log On
      Keep_Log Off
      K8S-Logging.Parser On
      K8S-Logging.Exclude On

    [FILTER] # Trim port from the host field
      Name lua
      Match syslog.*
      script /fluent-bit/scripts/enrich.lua
      call strip_port

    [FILTER]
      Name parser
      Match syslog.haproxy
      Key_name message
      Parser haproxy
      Preserve_Key On
      Reserve_Data On

    [FILTER]
      Name   modify
      Match  syslog.haproxy
      Remove Tc
      Remove Tq
      Remove Tw
      Remove actconn
      Remove backend_queue
      Remove beconn
      Remove captured_request_cookie
      Remove captured_response_cookie
      Remove extradata
      Remove feconn
      Remove pid
      Remove pri
      Remove msgid
      Remove retries
      Remove srv_conn
      Remove srv_queue
      Remove termination_state

    [FILTER]
      Name lua
      Match syslog.haproxy
      script /fluent-bit/scripts/enrich.lua
      call waf_headers_enrich

    [FILTER]
      Name   geoip2
      Match  syslog.haproxy
      Database /fluent-bit/etc/geoip/GeoLite2-City.mmdb
      Lookup_key http_xff
      Record geoip_country_name http_xff %{country.names.en}
      Record geoip_country_iso http_xff %{country.iso_code}
      Record geoip_city_name http_xff %{city.names.en}
      Record geoip_latitude http_xff %{location.latitude}
      Record geoip_longitude http_xff %{location.longitude}

    [FILTER]
      Name lua
      Match syslog.haproxy
      script /fluent-bit/scripts/enrich.lua
      call merge_geoip

  outputs: |
    [OUTPUT]
      Name opensearch
      Match host.kubesystem
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-systemd
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match host.all
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-system-journal-prod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match kube.*
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-container-log
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match syslog.haproxy
      Host opsi-klp.starixplay.com
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-sc-klprod
      Replace_Dots On
