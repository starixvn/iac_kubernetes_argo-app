image:
  repository: nexhub.ops-dr.nebula.prod/kbt/base/fluent/fluent-bit
  tag: 4.0.3-geoip

# nodeSelector:
#   node-role.kubernetes.io/control-plane: "true"
#   node-role.kubernetes.io/etcd: "true"
#   node-role.kubernetes.io/master: "true"

config:
  inputs: |
    [INPUT]
      Name tail
      Tag kube.kubesystem.<namespace_name>.<pod_name>.<container_name>.<container_id>
      Tag_Regex (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-(?<container_id>[a-z0-9]{64})\.log$
      Path /var/log/containers/coredns*.log,/var/log/containers/kube*.log
      multiline.parser docker, cri
      Mem_Buf_Limit 10MB
      Skip_Long_Lines On

    [INPUT]
      Name systemd
      Tag host.all
      Read_From_Tail On
      Strip_Underscores On
      
  filters: |
    [FILTER]
      Name modify
      Match *
      Add env prod
      Add region ak
      Add org devops
      Add engine k3s

    [FILTER]
      Name kubernetes
      Match kube.kubesystem.*
      Kube_Tag_Prefix kube.kubesystem.
      Regex_Parser kubernetes-filter-custom-tag
      Merge_Log On
      Merge_Log_Key kube
      Keep_Log Off
      Use_Tag_For_Meta On
      K8S-Logging.Parser On
      K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
      Name opensearch
      Match host.all
      Host opsearch-atx-k3sdr.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-system-journal-prod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match kube.kubesystem.*
      Host opsearch-atx-k3sdr.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-container-log
      Replace_Dots On
