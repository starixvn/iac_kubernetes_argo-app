image:
  repository: hub.nexdev.net/base/fluent/fluent-bit
  tag: 4.0.3-geoip

# nodeSelector:
#   node-role.kubernetes.io/control-plane: "true"
#   node-role.kubernetes.io/etcd: "true"
#   node-role.kubernetes.io/master: "true"

extraPorts:
- port: 5170
  containerPort: 5170
  protocol: UDP
  name: syslog

config:
  inputs: |
    [INPUT]
      Name tail
      Path /var/log/containers/coredns*.log,/var/log/containers/kube*.log,/var/log/containers/argocd-*.log,/var/log/containers/longhorn-*.log
      multiline.parser docker, cri
      Tag kube.kubesystem.*
      Mem_Buf_Limit 10MB
      Skip_Long_Lines On

    [INPUT]
      Name syslog
      Tag syslog.haproxy
      Buffer_Chunk_Size 12MB
      Listen 0.0.0.0
      Port 5170
      Mode udp
      Parser syslog-rfc5424
      Source_Address_Key host
      
  filters: |
    [FILTER]
      Name modify
      Match *
      Add env local
      Add region vn
      Add org devops
      Add engine k3s

    [FILTER] # Trim port from the host field
      Name lua
      Match syslog.*
      script /fluent-bit/scripts/enrich.lua
      call strip_port

    [FILTER]
      Name kubernetes
      Match kube.*
      Kube_Tag_Prefix kube.kubesystem.
      Merge_Log On
      Keep_Log Off
      K8S-Logging.Parser On
      K8S-Logging.Exclude On

    [FILTER]
      Name lua
      Match kube.kubesystem.*
      script /fluent-bit/scripts/strip_ansi_color_code.lua
      call strip_ansi_color_code

    [FILTER]
      Name    grep
      Match   kube.kubesystem.*
      Exclude $log level=info
      Exclude $log \"GET (/[a-zA-Z0-9\-]*)+ HTTP/1.[01]\" 200
      Exclude $log Found redis master
      Exclude $log Identifying redis master 
      Exclude $log using sentinel \(argocd\-redis\-ha\)

    [FILTER]
      Name parser
      Match syslog.haproxy
      Key_name message
      Parser haproxy
      Preserve_Key On
      Reserve_Data On

    [FILTER]
      Name   modify
      Match  syslog.haproxy
      Remove Tc
      Remove Tq
      Remove Tw
      Remove actconn
      Remove backend_queue
      Remove beconn
      Remove captured_request_cookie
      Remove captured_response_cookie
      Remove extradata
      Remove feconn
      Remove pid
      Remove pri
      Remove msgid
      Remove retries
      Remove srv_conn
      Remove srv_queue
      Remove termination_state

    [FILTER]
      Name lua
      Match syslog.haproxy
      script /fluent-bit/scripts/enrich.lua
      call waf_headers_enrich

    [FILTER]
      Name   geoip2
      Match  syslog.haproxy
      Database /fluent-bit/etc/geoip/GeoLite2-City.mmdb
      Lookup_key http_xff
      Record geoip_country_name http_xff %{country.names.en}
      Record geoip_country_iso http_xff %{country.iso_code}
      Record geoip_city_name http_xff %{city.names.en}
      Record geoip_latitude http_xff %{location.latitude}
      Record geoip_longitude http_xff %{location.longitude}
      Log_Level error

    [FILTER]
      Name lua
      Match syslog.haproxy
      script /fluent-bit/scripts/enrich.lua
      call merge_geoip

    # [FILTER]
    #   Name lua
    #   Match syslog.haproxy
    #   script /fluent-bit/scripts/drop.lua
    #   call drop_success

  outputs: |
    [OUTPUT]
      Name opensearch
      Match kube.kubesystem.*
      Host opensearch-cluster-master.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-container-nexops
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match syslog.haproxy
      Buffer_Size 64MB
      Host opensearch-cluster-master.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-nexprod
      Replace_Dots On
      Trace_Error    On

