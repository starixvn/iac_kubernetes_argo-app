image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit

# nodeSelector:
#   node-role.kubernetes.io/control-plane: "true"
#   node-role.kubernetes.io/etcd: "true"
#   node-role.kubernetes.io/master: "true"

extraPorts:
- port: 5170
  containerPort: 5170
  protocol: UDP
  name: syslog

config:
  inputs: |
    [INPUT]
      Name tail
      Path /var/log/containers/coredns*.log,/var/log/containers/kube*.log
      multiline.parser docker, cri
      Tag kube.kubesystem
      Mem_Buf_Limit 5MB
      Skip_Long_Lines On

    [INPUT]
      Name systemd
      Tag host.kubesystem
      Systemd_Filter _SYSTEMD_UNIT=k3s.service
      Systemd_Filter _SYSTEMD_UNIT=k3s-node.service
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name systemd
      Tag host.all
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name syslog
      Tag syslog.haproxy
      Parser haproxy
      Listen 0.0.0.0
      Port 5170
      Mode udp
      
  filters: |
    [FILTER]
      Name modify
      Match *
      Add env k3sprod
      Add cluster_type k3s

    [FILTER]
      Name kubernetes
      Match kube.*
      Merge_Log On
      Keep_Log Off
      K8S-Logging.Parser On
      K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
      Name opensearch
      Match host.kubesystem
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-systemd
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match host.all
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-system-journal-prod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match kube.kubesystem
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-container-log
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match syslog.haproxy
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-debug
      Replace_Dots On