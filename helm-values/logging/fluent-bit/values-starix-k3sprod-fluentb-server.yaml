image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit
  tag: 4.0.3-geoip

kind: Deployment
replicaCount: 3

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
  node-role.kubernetes.io/etcd: "true"
  node-role.kubernetes.io/master: "true"

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

service:
  type: NodePort
  nodePort: 30020

ingress:
  enabled: false
  ingressClassName: haproxy
  hosts:
  - host: flb.ops-klprod.gamora.prod

# flush: 20

extraPorts:
- port: 5170
  containerPort: 5170
  protocol: UDP
  name: scpt2-haproxy # SC - Prod - Tier2
  nodePort: 31170

- port: 5171
  containerPort: 5171
  protocol: UDP
  name: scut2-haproxy # SC - UAT - Tier2
  nodePort: 31171

- port: 5172
  containerPort: 5172
  protocol: UDP
  name: stpt2-haproxy # ST - PROD - Tier2
  nodePort: 31172

- port: 5173
  containerPort: 5173
  protocol: UDP
  name: alpt2-haproxy # Alpha - PROD - Tier2
  nodePort: 31173

- port: 5174
  containerPort: 5174
  protocol: UDP
  name: wspt2-haproxy # Wasa - Prod - Tier2
  nodePort: 31174

- port: 5175
  containerPort: 5175
  protocol: UDP
  name: stut2-haproxy # ST - UAT - Tier2
  nodePort: 31175

- port: 5178
  containerPort: 5178
  protocol: UDP
  name: dopt2-haproxy # DevOps - Prod - Tier2
  nodePort: 31178

- port: 5179
  containerPort: 5179
  protocol: UDP
  name: dout2-haproxy # DevOps - UAT - Tier2
  nodePort: 31179


config:
  inputs: |
    # [INPUT]
    #   Name forward
    #   Tag forward.haproxy.sc.t1prod
    #   Listen 0.0.0.0
    #   Port 24224
    #   Buffer_Chunk_Size 1M
    #   Buffer_Max_Size 6M
    #   Security.Users fluentbit 29a2VG8BnWXsr3hX
    #   Self_Hostname flb-klp.server.local

    [INPUT]
      Name syslog
      Tag scpt2.haproxy
      Listen 0.0.0.0
      Port 5170
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag scut2.haproxy
      Listen 0.0.0.0
      Port 5171
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag stpt2.haproxy
      Listen 0.0.0.0
      Port 5172
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag alpt2.haproxy
      Listen 0.0.0.0
      Port 5173
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag wspt2.haproxy
      Listen 0.0.0.0
      Port 5174
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag stut2.haproxy
      Listen 0.0.0.0
      Port 5175
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag dopt2.haproxy
      Listen 0.0.0.0
      Port 5178
      Mode udp
      Source_Address_Key host

    [INPUT]
      Name syslog
      Tag dout2.haproxy
      Listen 0.0.0.0
      Port 5179
      Mode udp
      Source_Address_Key host
      
  filters: |
    

    [FILTER]
      Name lua
      Match *
      script /fluent-bit/scripts/enrich.lua
      call strip_port

    [FILTER]
      Name parser
      Match *haproxy*
      Key_name message
      Parser haproxy
      Preserve_Key On
      Reserve_Data On

    [FILTER]
      Name   modify
      Match  *haproxy*
      Remove Tc
      Remove Tq
      Remove Tw
      Remove actconn
      Remove backend_queue
      Remove beconn
      Remove captured_request_cookie
      Remove captured_response_cookie
      Remove extradata
      Remove feconn
      Remove pid
      Remove pri
      Remove msgid
      Remove retries
      Remove srv_conn
      Remove srv_queue
      Remove termination_state

    [FILTER]
      Name lua
      Match *haproxy*
      script /fluent-bit/scripts/enrich.lua
      call waf_headers_enrich

    [FILTER]
      Name   geoip2
      Match  *haproxy*
      Database /fluent-bit/etc/geoip/GeoLite2-City.mmdb
      Lookup_key http_xff
      Record geoip_country_name http_xff %{country.names.en}
      Record geoip_country_iso http_xff %{country.iso_code}
      Record geoip_city_name http_xff %{city.names.en}
      Record geoip_latitude http_xff %{location.latitude}
      Record geoip_longitude http_xff %{location.longitude}
      Log_Level error

    [FILTER]
      Name lua
      Match *haproxy*
      script /fluent-bit/scripts/enrich.lua
      call merge_geoip

    [FILTER]
      Name lua
      Match_Regex ^(dopt2|dout2).haproxy
      script /fluent-bit/scripts/drop.lua
      call drop_success

    ##########################
    #### ENV Field EnRich ####
    [FILTER]
      Name modify
      Match_Regex scpt2.*
      Add env prod
      Add region kl
      Add org lumi
      Add team pentagon
      Add engine k8s

    [FILTER]
      Name modify
      Match_Regex scut2.*
      Add env uat
      Add region kl
      Add org lumi
      Add team pentagon
      Add engine k8s

    [FILTER]
      Name modify
      Match_Regex stpt2.*
      Add env prod
      Add region kl
      Add org starix
      Add team starix
      Add engine k8s

    [FILTER]
      Name modify
      Match_Regex alpt2.*
      Add env prod
      Add region kl
      Add org starix
      Add team alpha
      Add engine k8s

    [FILTER]
      Name modify
      Match_Regex wspt2.*
      Add env prod
      Add region kl
      Add org starix
      Add team wabisabi
      Add engine k8s

    [FILTER]
      Name modify
      Match_Regex stut2.*
      Add env uat
      Add region kl
      Add org starix
      Add team starix
      Add engine k8s

    [FILTER]
      Name modify
      Match dopt2.*
      Add env prod
      Add region kl
      Add org devops
      Add engine k3s

    [FILTER]
      Name modify
      Match dout2.*
      Add env uat
      Add region kl
      Add org devops
      Add engine k3s

  outputs: |
    [OUTPUT]
      Name opensearch
      Match scpt2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-sc-klprod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match scut2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-sc-uat
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match stpt2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-swarm-starix-klprod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match alpt2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-swarm-starix-alphaklprod
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match wspt2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-swarm-starix-uat
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match stut2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-sc-uat
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match dopt2.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-k3sprod-prod
