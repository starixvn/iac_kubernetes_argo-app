image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit
  tag: 4.0.3-geoip

kind: Deployment
replicaCount: 3

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
  node-role.kubernetes.io/etcd: "true"
  node-role.kubernetes.io/master: "true"

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

service:
  type: NodePort
  nodePort: 30020

ingress:
  enabled: true
  ingressClassName: haproxy
  hosts:
  - host: flb.ops-klprod.gamora.prod

flush: 20

extraPorts:
- port: 24224
  containerPort: 24224
  protocol: TCP
  name: forward
  nodePort: 32224

config:
  inputs: |
    [INPUT]
      Name forward
      Tag forward.haproxy.sc.t1prod
      Listen 0.0.0.0
      Port 24224
      Buffer_Chunk_Size 1M
      Buffer_Max_Size 6M
      Security.Users fluentbit 29a2VG8BnWXsr3hX
      Self_Hostname flb-klp.server.local
      
  filters: |
    [FILTER]
      Name modify
      Match *
      Add env unknown
      Add region unknown
      Add engine unknown

  outputs: |
    [OUTPUT]
      Name opensearch
      Match forward.haproxy.sc.t1prod
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-sc-t1prod
      Replace_Dots On