image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit
  tag: 4.0.3-geoip

kind: Deployment
replicaCount: 3

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
  node-role.kubernetes.io/etcd: "true"
  node-role.kubernetes.io/master: "true"

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

service:
  type: NodePort
  nodePort: 30020

ingress:
  enabled: false
  ingressClassName: haproxy
  hosts:
  - host: flb.ops-klprod.gamora.prod

flush: 20

extraPorts:
- port: 5270
  containerPort: 5270
  protocol: UDP
  name: scpt1-kubescape
  nodePort: 31270

config:
  inputs: |
    # [INPUT]
    #   Name forward
    #   Tag forward.haproxy.sc.t1prod
    #   Listen 0.0.0.0
    #   Port 24224
    #   Buffer_Chunk_Size 1M
    #   Buffer_Max_Size 6M
    #   Security.Users fluentbit 29a2VG8BnWXsr3hX
    #   Self_Hostname flb-klp.server.local

    [INPUT]
      Name syslog
      Tag scpt1.syslog.kubescape
      Listen 0.0.0.0
      Port 5270
      Mode udp
      Parser syslog-rfc5424
      Source_Address_Key host
      
  filters: |
    [FILTER]
      Name modify
      Match scpt1.*
      Add env prod
      Add region kl
      Add org lumi

  outputs: |
    [OUTPUT]
      Name opensearch
      Match scpt1.syslog.kubescape
      Host opsearch-atx-k3sprod.logging
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubescape-scpt1
      Replace_Dots On