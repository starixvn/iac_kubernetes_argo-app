image:
  repository: nexhub.ops-klprod.gamora.prod/kbt/base/fluent/fluent-bit

extraPorts:
- port: 5170
  containerPort: 5170
  protocol: UDP
  name: syslog

config:
  inputs: |
    [INPUT]
      Name tail
      Path /var/log/containers/coredns*.log,/var/log/containers/kube*.log
      multiline.parser docker, cri
      Tag kube.kubesystem
      Mem_Buf_Limit 5MB
      Skip_Long_Lines On

    [INPUT]
      Name systemd
      Tag host.kubesystem
      Systemd_Filter _SYSTEMD_UNIT=k3s.service
      Systemd_Filter _SYSTEMD_UNIT=k3s-node.service
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name systemd
      Tag host.all
      Read_From_Tail On
      Strip_Underscores On

    [INPUT]
      Name syslog
      Tag syslog.haproxy
      Listen 0.0.0.0
      Port 5170
      Mode udp
      
  filters: |

    [FILTER]
      Name kubernetes
      Match kube.*
      Merge_Log On
      Keep_Log Off
      K8S-Logging.Parser On
      K8S-Logging.Exclude On

    [FILTER]
      Name parser
      Match syslog.haproxy
      Key_name message
      Parser haproxy

    [FILTER]
      Name lua
      Match syslog.haproxy
      script /fluent-bit/scripts/haproxy_to_waf.lua
      call map_to_waf_like

    # [FILTER]
    #   Name   geoip2
    #   Match  syslog.haproxy
    #   Database /etc/geoip/GeoLite2-City.mmdb
    #   Lookup_key http_xff
    #   Record geoip_country_name country.names.en
    #   Record geoip_country_iso country.iso_code
    #   Record geoip_city_name city.names.en
    #   Record geoip_latitude location.latitude
    #   Record geoip_longitude location.longitude

    # [FILTER]
    #   Name lua
    #   Match syslog.haproxy
    #   script /fluent-bit/scripts/merge_geoip.lua
    #   call merge_geoip

    [FILTER]
      Name modify
      Match *
      Add env uat

  outputs: |
    [OUTPUT]
      Name opensearch
      Match host.kubesystem
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-systemd
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match host.all
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-system-journal-uat
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match kube.kubesystem
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-kubesystem-container-log
      Replace_Dots On

    [OUTPUT]
      Name opensearch
      Match syslog.haproxy
      Host opsi.ops-klprod.gamora.prod
      Port 443
      tls On
      tls.verify Off
      HTTP_User logstash
      HTTP_Passwd logstash
      Suppress_Type_Name On
      Index logstash-haproxy-ing-k3suat-uat
      Replace_Dots On
