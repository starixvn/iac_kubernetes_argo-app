tolerations:
- operator: Exists

luaScripts:
  strip_ansi_color_code: |
    function strip_ansi_color_code(tag, timestamp, record)
      if type(record["log"]) == "string" then 
        record["log"] = record["log"]:gsub('[\27\155][][()#;?%d]*[A-PRZcf-ntqry=><~]', '') 
        return 2, 0, record 
      end 
      return 0, 0, 0
    end

config:
  service: |
    [SERVICE]
      Daemon Off
      Flush {{ .Values.flush }}
      Log_Level {{ .Values.logLevel }}
      Parsers_File /fluent-bit/etc/parsers.conf
      Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
      HTTP_Server On
      HTTP_Listen 0.0.0.0
      HTTP_Port {{ .Values.metricsPort }}
      Health_Check On

  customParsers: |
    [PARSER]
      Name docker_no_time
      Format json
      Time_Keep Off
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L

    [PARSER]
      Name  haproxy
      Format  regex
      Regex ^(?<client_ip>\S+):(?<client_port>\d+) \[(?<accept_date>[^\]]+)\] (?<frontend>[^ ]+) (?<backend_server>[^ ]+) (?<Tq>\d+)/(?<Tw>\d+)/(?<Tc>\d+)/(?<Tr>\d+)/(?<Tt>\d+) (?<status_code>\d+) (?<bytes_read>\d+) (?<captured_request_cookie>[^ ]+) (?<captured_response_cookie>[^ ]+) (?<termination_state>[^ ]+) (?<actconn>\d+)/(?<feconn>\d+)/(?<beconn>\d+)/(?<srv_conn>\d+)/(?<retries>\d+) (?<srv_queue>\d+)/(?<backend_queue>\d+) \{(?<http_user_agent>[^\}]*)\} "(?<http_request>[^"]+)"
      Time_Key    time
      Time_Format %d/%b/%Y:%H:%M:%S.%L
      Time_Keep   On
      Time_Strict  Off