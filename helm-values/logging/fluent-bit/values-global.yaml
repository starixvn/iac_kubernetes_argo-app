tolerations:
- operator: Exists

luaScripts:
  strip_ansi_color_code.lua: |
    function strip_ansi_color_code(tag, ts, record)
      if type(record["log"]) == "string" then 
        record["log"] = record["log"]:gsub('[\27\155][][()#;?%d]*[A-PRZcf-ntqry=><~]', '') 
        return 2, 0, record 
      end 
      return 0, 0, 0
    end

  enrich.lua: |
    function waf_headers_enrich(tag, ts, record)
      -- Header Enrich --
      local raw = record["http_headers_raw"]
      if type(raw) ~= "string" or raw == "" then
        return 1, ts, record
      end

      local parts = {}
      for token in string.gmatch(raw .. "|", "([^|]*)|") do
        table.insert(parts, token)
      end

      local headers = {}
      local names = {"Host", "User-Agent", "Referer", "X-Forwarded-For", "X-Actual-Ip"}
      for i, name in ipairs(names) do
        local val = parts[i] or ""
        if val and val ~= "-" and val ~= "" then
          table.insert(headers, { name = name, value = val })
          if name == "Host" then
            record["request_host"] = val
          elseif name == "User-Agent" then
            record["user_agent"] = val
          elseif name == "X-Forwarded-For" then
            record["http_xff"] = val
          elseif name == "X-Actual-Ip" then
            record["http_xff"] = val
          elseif name == "Referer" then
            record["http_referer"] = val
          end
        end
      end

      if #headers > 0 then
        record["httpRequest"] = { headers = headers }
      end

      -- Remove original raw field
      record["http_headers_raw"] = nil

      -- Rename CS_ Field
      -- record = rename_field(record, "http_method", "cs-method")
      -- record = rename_field(record, "http_method", "cs-uri-query")
      -- record = rename_field(record, "http_method", "sc-status")

      return 1, ts, record
    end

    function strip_port(tag, ts, record)
      local h = record["host"]
      if type(h) == "string" then
        local proto, ip = string.match(h, "^(%w+)://([0-9%.]+):%d+$")
        if proto and ip then
          record["host"] = proto .. "://" .. ip
        end
      end
      return 1, ts, record
    end

    function merge_geoip(tag, ts, record)
      if record["geoip_country_name"] or record["geoip_city_name"] then
        local lat = record["geoip_latitude"]
        local lon = record["geoip_longitude"]

        -- Build nested geoip object
        record["geoip"] = {
          country_name = record["geoip_country_name"],
          country_iso  = record["geoip_country_iso"],
          city_name    = record["geoip_city_name"],
          location     = {
            lat = lat,
            lon = lon
          }
        }

        -- Clean up flat fields produced by geoip2 filter
        record["geoip_country_name"] = nil
        record["geoip_country_iso"]  = nil
        record["geoip_city_name"]    = nil
        record["geoip_latitude"]     = nil
        record["geoip_longitude"]    = nil
      end

      return 1, ts, record
    end

    local function rename_field(record, old_key, new_key)
      local val = record[old_key]
      if val ~= nil then
        if record[new_key] == nil then
          record[new_key] = val
        end
        record[old_key] = nil
      end
      return record
    end

  drop.lua: |
    function drop_success(tag, ts, record)
      -- Defensive checks
      local status = record["status_code"]
      local tr     = record["Tr"]

      -- Drop logs if:
      -- status_code == "200" AND Tr < 5000 ms (5 seconds)
      if status == "200" and tr ~= nil then
        local tr_num = tonumber(tr)
        if tr_num and tr_num < 5000 then
          return -1, ts, record
        end
      end

      -- Keep everything else
      return 1, ts, record
    end

    function drop_pentagon_custom(tag, ts, record)
      -- Defensive checks
      local status = record["status_code"]
      local uri    = record["request_path"]

      local drop_rules = {
        ["404"] = {
          "^/favicon.ico$"
        }
      }

      -- Drop logic: exact match check
      local rules = drop_rules[status]
      if rules then
        for _, pattern in ipairs(rules) do
          if uri:match(pattern) then
            return -1, timestamp, record
          end
        end
      end

      -- Keep everything else
      return 1, ts, record
    end

  kubescape_handler.lua: |
    function parser(tag, timestamp, record)
      local out = {}
      ---------------------------------------------------------
      -- BaseRuntimeMetadata
      local brm = record["BaseRuntimeMetadata"]
      if type(brm) == "table" then
        out["alertName"]   = brm["alertName"]
        out["severity"]    = brm["severity"]
        out["timestamp"]   = brm["timestamp"]
        out["arguments"]   = brm["arguments"]
        out["identifiers"] = brm["identifiers"]

        -- Profile Metadata (optional)
        local pm = brm["profileMetadata"]
        if type(pm) == "table" then
          out["profileName"]   = pm["name"]
          out["profileStatus"] = pm["status"]
          -- out["profileType"]  = pm["type"]
        end
      end

      ---------------------------------------------------------
      -- RuntimeK8sDetails
      local k8s = record["RuntimeK8sDetails"]
      if type(k8s) == "table" then
        out["clusterName"]   = k8s["clusterName"]
        out["namespace"]     = k8s["namespace"]
        out["podName"]       = k8s["podName"]
        out["containerName"] = k8s["containerName"]
        out["image"]         = k8s["image"]
      end

      ---------------------------------------------------------
      -- RuntimeProcessDetails
      local rpd = record["RuntimeProcessDetails"]
      if type(rpd) == "table" then
        out["processTree"]   = rpd["processTree"]
      end

      ---------------------------------------------------------
      -- Root-level fields
      out["ruleID"]  = record["RuleID"]
      out["level"]   = record["level"]
      out["message"] = record["message"] or record["msg"]
      out["time"]    = record["time"]

      ---------------------------------------------------------
      -- Return transformed record
      return 1, timestamp, out
    end

config:
  service: |
    [SERVICE]
      Daemon Off
      Flush {{ .Values.flush }}
      Log_Level {{ .Values.logLevel }}
      Parsers_File /fluent-bit/etc/parsers.conf
      Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
      HTTP_Server On
      HTTP_Listen 0.0.0.0
      HTTP_Port {{ .Values.metricsPort }}
      Health_Check On

  customParsers: |
    [PARSER]
      Name docker_no_time
      Format json
      Time_Keep Off
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L

    [PARSER]
      Name haproxy
      Format regex
      Regex ^(?<client_ip>\S+):(?<client_port>\d+)\s+\[(?<accept_date>[^\]]+)\]\s+(?<frontend>\S+)\s+(?<backend>[^\/]+)\/(?<server>\S+)\s+(?<Tq>-?\d+)\/(?<Tw>-?\d+)\/(?<Tc>-?\d+)\/(?<Tr>-?\d+)\/(?<Tt>-?\d+)\s+(?<status_code>\d+)\s+(?<bytes_read>\d+)\s+(?<captured_request_cookie>\S+)\s+(?<captured_response_cookie>\S+)\s+(?<termination_state>\S+)\s+(?<actconn>\d+)\/(?<feconn>\d+)\/(?<beconn>\d+)\/(?<srv_conn>\d+)\/(?<retries>\d+)\s+(?<srv_queue>\d+)\/(?<backend_queue>\d+)\s+\{(?<http_headers_raw>[^\}]*)\}\s+"(?<http_method>[A-Z]+)\s+(?:(?<request_host>[^\/\s]+))?(?<request_path>\/[^ ]*)?\s+(?<http_version>HTTP\/\d\.\d)"$

    [PARSER]
      Name json_kubescape
      Format json
      Time_Keep Off
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S %z