replicas: 2
image: "nexhub.ops-klprod.gamora.prod/kbt/base/logstash/logstash"

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port => 5044
      }
      syslog {
        port => 5045
        type => "syslog"
        tags => ["uat"]
      }
      tcp {
        port => 5064
        type => "vault"
        tags => ["uat", "st"]
      }

      http {
        port => 6968
        type => "http-app"
        tags => ["uat","subarashi"]
      }
      http {
        port => 6969
        type => "http-app"
        tags => ["uat","pioneers"]
      }

      syslog {
        port => 6970
        type => "kubescape"
        tags => ["uat", "sc"]
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "vault"}
        }

        if [auth][display_name] == "approle" and 
          [request][mount_type] == "kv" and 
          [request][operation] == "read" { drop {} }
        else if [auth][display_name] == "approle" and 
          [request][operation] == "read" and 
          [request][path] == "auth/token/lookup-self" { drop {} }
      }
    }

  syslog_filter.conf: |
    filter {
      if [type] == "syslog" {
        if [program] == "haproxy" {
          if [facility_label] == "local1" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "k3suat"]
            }
          }
          else if [facility_label] == "local3" {
            mutate {
              add_tag => ["haproxy_access", "hap-swarm", "st", "stuat"]
            }
          }
          else if [facility_label] == "local5" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "scuat"]
            }
          }
          else {
            mutate {
              add_tag => ["haproxy_access"]
            }
          }
        }
      }

      if "haproxy_access" in [tags] {
        grok {
          match => {
            "message" => [
              "%{HAPROXYHTTPBASE}",
              "%{HAPROXYHTTP}",
              "%{HAPROXYTCP}",
              "%{HAPROXYGW}"
            ]
          }
        }
        if ![accept_date] {
          grok { match => ["message", "%{HAPROXYDATE:accept_date}"] }
        }
        if [captured_request_headers] {
          grok { match => {
              "captured_request_headers" => [
                "%{DATA:request_host}\|%{DATA:user-agent}\|%{DATA:request_referer}\|(%{IP:TrueClientIP})?" 
              ]
            }
          }

          # Define expected headers
          mutate {
            add_field => {
              "[_tmp][header_names]" => "Host|User-Agent|Referer|X-Forwarded-For"
            }
          }

          # Standarized headers field
          ruby {
            code => '
              raw_header = event.get("captured_request_headers")
              if raw_header.is_a?(String)
                split_headers = raw_header.split("|", -1)
                event.set("captured_request_headers", split_headers)
              end
              raw_header_name = event.get("[_tmp][header_names]")
              if raw_header_name.is_a?(String)
                split_headers = raw_header_name.split("|", -1)
                event.set("[_tmp][header_names]", split_headers)
              end
              header_keys = event.get("[_tmp][header_names]")
              header_vals = event.get("captured_request_headers")

              if header_keys.is_a?(Array) && header_vals.is_a?(Array)
                if header_keys.length == header_vals.length
                  headers = header_keys.zip(header_vals).map do |k, v|
                    { "name" => k, "value" => v }
                  end
                  event.set("[httpRequest][headers]", headers)
                else
                  event.tag("header_parse_mismatch")
                  event.set("[httpRequest][headers_parse_error]", {
                    "expected_keys" => header_keys.length,
                    "actual_values" => header_vals.length
                  })
                end
              else
                event.tag("header_parse_error")
              end
            '
          }

          # Cleanup temporary fields
          mutate {
            remove_field => ["_tmp"]
          }
        }
        mutate {
          remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
          remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
          remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
          remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","timestamp8601"]
          convert => {
            "http_status_code" => "integer"
            "time_backend_response" => "integer"
          }
        }
        if "hap-swarm" in [tags] {
          date {
            match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
            timezone => "Asia/Taipei"
          }
        }
        else if "hap-ing" in [tags] {
          date {
            match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
            timezone => "UTC"
          }
        }
        if [TrueClientIP] {
          geoip { source => "TrueClientIP" }
        }

        if "hap-gw" in [tags] {
        }
        else if "k3suat" in [tags] {
          if [http_status_code] == 200 and [time_backend_response] < 5000 { drop {} }
          else if [backend_name] == "stats" { drop {} }
        }
        else if "hap-swarm" in [tags] {
          if [captured_request_headers] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|grafana|whoami|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ { drop {} }
          else if [message] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|health|whoami|healthz|grafana|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ { drop {} }
          # else if [http_status_code] == 200 and [time_backend_response] < 5000 { drop {} }
        }
        else if "hap-ing" in [tags] {
          if [captured_request_headers] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|grafana|whoami|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ { drop {} }
          else if [message] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|health|whoami|healthz|grafana|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ { drop {} }
          else if [backend_name] == "stats" { drop {} }
        }
      }
    }

  http_app_pioneers.conf: |
    filter {
      if [type] == "http-app" and
         "pioneers" in [tags] {
        ### Alphalog PIONEERS
        if [Properties][Category] == "Alpha-API" or 
           [Properties][Category] == "Ext-API" {
          if [Properties][RequestPath] == "/health" or 
             [Properties][RequestPath] == "/" { drop {} }
          if ! [Properties][RequestPath] { drop {} }
          mutate {
            remove_field => ["[headers][request_path]", "[headers][http_host]", "[headers][content_type]", "[headers][content_length]", "host"]
          }
        }
        if [Properties][Team] == "Pioneers" {
          mutate {
            remove_field => ["[Renderings]", "[Properties][HttpLog]", "MessageTemplate", "[Properties][Elapsed]", "[Properties][SourceContext]"]
          }
          if [Properties][RequestPath] == "/" { drop {} }
          if [Properties][Application] == "Deposit.ApiGateways" {
            mutate {
              add_tag => ["deposit-apigw"]
            }
          }
          if [Properties][Application] == "Licensee.AdminSetting.API" {
            mutate {
              add_tag => ["licensee-adminsetting"]
            }
          }           
        }
      }
    }

  http_app_subarashi.conf: |
    filter {
      if [type] == "http-app" and
         "subarashi" in [tags] {
        if [Properties][Team] == "Subarashi" {
          mutate {
            remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
          }
          if [Properties][RequestPath] == "/" { drop {} }
        }
      }
    }

  kubescape_filter.conf: |
    filter {
      if [type] == "kubescape" {
        grok {
          match => {
            "message" => "<%{NONNEGINT:syslog_pri}>%{NONNEGINT:version}%{SPACE}(?:-|%{TIMESTAMP_ISO8601:syslog_timestamp})%{SPACE}(?:-|%{IPORHOST:hostname})%{SPACE}(?:%{SYSLOG5424PRINTASCII:program}|-)%{SPACE}(?:-|%{SYSLOG5424PRINTASCII:process_id})%{SPACE}(?:-|%{SYSLOG5424PRINTASCII:message_id})%{SPACE}(?:-|(?<structured_data>(\[.*?[^\\]\])+))(?:%{SPACE}%{GREEDYDATA:syslog_message}|)"
          }
          add_tag => [ "match" ]
        }
        if "match" in [tags] {
          syslog_pri {
            remove_field => "syslog_pri"
          }
          date {
            match => [ "syslog_timestamp", "ISO8601", "MMM dd HH:mm:ss", "MMM dd HH:mm:ss.SSS" ]
            remove_field => "syslog_timestamp"
          }
          if [structured_data] {
            ruby {
              code => '
                # https://github.com/logstash-plugins/logstash-input-syslog/issues/15#issuecomment-270367033
                def extract_syslog5424_sd(syslog5424_sd)
                  sd = {}
                  syslog5424_sd.scan(/\[(?<element>.*?[^\\])\]/) do |element|
                    data = element[0].match(/(?<sd_id>[^\ ]+)(?<sd_params> .*)?/)
                    sd_id = data[:sd_id].split("@", 2)[0]
                    sd[sd_id] = {}
                    next if data.nil? || data[:sd_params].nil?
                    data[:sd_params].scan(/ (.*?[=](?:""|".*?[^\\]"))/) do |set|
                      set = set[0].match(/(?<param_name>.*?)[=]\"(?<param_value>.*)\"/)
                      sd[sd_id][set[:param_name]] = set[:param_value]
                    end
                  end
                  sd
                end
                event.set("[sd]", extract_syslog5424_sd(event.get("[structured_data]")))
              '
              remove_field => "structured_data"
            }
          }
        }
      }
    }

  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "uat" in [tags] and "st" in [tags] {
          opensearch {
            hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-starix-uat"
            action => "create"
          }        
        }
        else {
          opensearch {
            hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-unknown"
            action => "create"
          }       
        }
      }
    }

  syslog_output.conf: |
    output {
      if [type] == "syslog" {
        if "hap-swarm" in [tags] {
          if "stkluat" in [tags] and "uat" in [tags] {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-swarm-starix-stuat"
              action => "create"
            }
          }
        }
        else if "hap-ing" in [tags] {
          if "k3suat" in [tags] and "uat" in [tags] {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-k3suat-uat"
              action => "create"
            }
          }
          else if "scuat" in [tags] and "uat" in [tags] {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-sc-uat"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-unknown"
              action => "create"
            }         
          }
        }
      }
    }

  http_app_output.conf: |
    output {
      if [type] == "http-app" {
        if "pioneers" in [tags] {
          if [Properties][Category] == "Ext-API" {
            if [Properties][Environment] == "KLPROD" {
              if [Properties][Application] == "Ext.ApiGateways" {
                opensearch {
                  hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
                  user => "logstash"
                  password => "logstash"
                  ssl => true
                  ssl_certificate_verification => false
                  index => "logstash-alpha-apiext-uat"
                  action => "create"
                }
              }
            }
          }
          if "rome" in [message] or [backend_name] =~ /rome_.*/ {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-pioneers-uat-haproxy-nexcel"
              action => "create"
            }
          }
        }
        if "subarashi" in [tags] {
          if [Properties][Application] == "Deposit API Gateway" {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-deposit-api-uat"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-uat-default"
              action => "create"
            }
          }
        }
      }
    }

  kubescape_output.conf: |
    output {
      if [type] == "kubescape" {
        if "sc" in [tags] and "uat" in [tags] {
          opensearch {
            hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-kubescape-uat"
            action => "create"
          }
        }
        else {
          opensearch {
            hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-unknown"
            action => "create"
          } 
        }
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["http", "tcp", "syslog", "vault"] {
        opensearch {
          hosts => ["https://opsi.ops-klprod.gamora.prod:443"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown"
          action => "create"
        }   
      }
    }

    
logstashJavaOpts: "-Xmx2g -Xms2g -Dhttp.proxyHost=iusqd-uat.gamora.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=iusqd-uat.gamora.prod -Dhttps.proxyPort=8801"

resources:
  requests:
    memory: "1Gi"
  limits:
    memory: "3Gi"

nodeSelector:
  node-role.kubernetes.io/logstash: ""

httpPort: 9600
extraPorts:
  - name: tcp
    containerPort: 5044
  - name: syslog-tcp
    containerPort: 5045
    protocol: TCP
  - name: syslog-udp
    containerPort: 5045
    protocol: UDP
  - name: vault-st-uat
    containerPort: 5064

  - name: http-suba
    containerPort: 6968
    protocol: TCP
  - name: http-pier
    containerPort: 6969
    protocol: TCP

  - name: kubescape-sc-t
    containerPort: 6970
    protocol: TCP
  - name: kubescape-sc-u
    containerPort: 6970
    protocol: UDP


service:
  type: NodePort
  # externalTrafficPolicy: Local
  ports:
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: tcp
  - name: syslog-tcp
    nodePort: 30045
    port: 5045
    protocol: TCP
    targetPort: syslog-tcp
  - name: syslog-udp
    nodePort: 30045
    port: 5045
    protocol: UDP
    targetPort: syslog-udp
  - name: vault-st-uat
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: vault-st-uat

  - name: http-suba
    nodePort: 30968
    port: 6968
    protocol: TCP
    targetPort: http-suba
  - name: http-pier
    nodePort: 30969
    port: 6969
    protocol: TCP
    targetPort: http-pier

  - name: kubescape-sc-t
    nodePort: 30970
    port: 6970
    protocol: TCP
    targetPort: kubescape-sc-t
  - name: kubescape-sc-u
    nodePort: 30970
    port: 6970
    protocol: UDP
    targetPort: kubescape-sc-u