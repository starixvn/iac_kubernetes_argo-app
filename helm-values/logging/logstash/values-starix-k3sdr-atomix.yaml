replicas: 2
image: "nexhub.ops-dr.nebula.prod/kbt/base/logstash/logstash"

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      beats {
        port => 5000
        type => "beats"
      }

      syslog {
        port => 5045
        type => "syslog"
        tags => ["prod"]
      }

      tcp {
        port => 5064
        type => "vault"
        tags => ["prod", "st"]
      }

      tcp {
        port => 5077
        type => "debug"
        tags => ["prod"]
      }

      http {
        port => 6968
        type => "http-app"
        tags => ["prod","subarashi"]
      }
      http {
        port => 6969
        type => "http-app"
        tags => ["prod","pioneers"]
      }

      tcp {
        port => 6970
        type => "dev-logs"
        tags => ["tcp"]
      }
    }

  global_filter.conf: |
    filter {
      mutate {
        add_field => { "env" => "prod" }
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "vault"}
        }

        if [auth][display_name] == "approle" and 
          [request][mount_type] == "kv" and 
          [request][operation] == "read" { drop {} }
        else if [auth][display_name] == "approle" and 
          [request][operation] == "read" and 
          [request][path] == "auth/token/lookup-self" { drop {} }
      }
    }

  debug_filter.conf: |
    filter {
      if [type] == "debug" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "debug"}
        }
      }
    }

  http_app_pioneers.conf: |
    filter {
      if [type] == "http-app" and
         "pioneers" in [tags] {
        ### Alphalog PIONEERS
        if [Properties][Category] in ["Alpha-API", "Ext-API"] {
          if [Properties][RequestPath] in ["/health", "/"] { drop {} }
          if ![Properties][RequestPath] { drop {} }
          # if ! [Properties][StatusCode] { drop {} }
          mutate {
            remove_field => ["[headers][request_path]", "[headers][http_host]", "[headers][content_type]", "[headers][content_length]", "host"]
          }
        }
      }
    }

  http_app_subarashi.conf: |
    filter {
      if [type] == "http-app" and
         "subarashi" in [tags] {
        if [Properties][Team] == "Subarashi" {
          mutate {
            remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
          }
          if [Properties][RequestPath] == "/" { drop {} }
        }
      }
    }

  dev_filter.conf: |
    filter {
      if [type] == "dev-logs"{
        json {
          source => "message"
        }

        ### SUBARASHI TEAM
        if [Properties][Team] == "Subarashi" {
          mutate {
            remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
            add_tag => ["subarashi"]
          }
        }
      }
    }

  ##############################################
  ############### OUTPUT SESSION ###############

  # beats_output.conf: |
  #   output {
  #     if [type] == "beats" {
  #       opensearch {
  #         hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
  #         user => "logstash"
  #         password => "logstash"
  #         ssl => true
  #         ssl_certificate_verification => false
  #         index => "logstash-%{[@metadata][beat]}-%{env}-%{+YYYY.MM.dd}"
  #         action => "create"
  #       }
  #     }
  #   }

  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "prod" in [tags] and "st" in [tags] {
          opensearch {
            hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-st-prod"
            action => "create"
          }        
        }
        else {
          opensearch {
            hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-unknown"
            action => "create"
          }       
        }
      }
    }

  debug_output.conf: |
    output {
      if [type] == "debug" {
        opensearch {
          hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-debug"
          action => "create"
        }   
      }
    }

  http_app_output.conf: |
    output {
      if [type] == "http-app" {
        if "pioneers" in [tags] {
          if [Properties][Category] == "Ext-API" {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-alpha-apiext-prod"
              action => "create"
            }
          }
          else if "rome" in [message] or [backend_name] =~ /rome_.*/ {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-pioneers-prod-haproxy-nexcel"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-pioneers-prod-default"
              action => "create"
            }
          }
        }
        else if "subarashi" in [tags] {
          if [Properties][Application] == "Deposit API Gateway" {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-deposit-api-prod"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-prod-default"
              action => "create"
            }
          }
        }
      }
    }

  dev_output.conf: |
    output {
      if [type] == "dev-logs" {
        if "subarashi" in [tags] {
          if [Properties][Application] == "AFF" {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-aff-landing-page"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-subarashi-prod-default"
              action => "create"
            }
          }
        }
        else {
          opensearch {
            hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-unknown"
            action => "create"
          }
        }
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["beats", "syslog", "vault", "debug", "http-app", "dev-logs"] {
        opensearch {
          hosts => ["https://opsearch-atx-k3sdr.logging:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown"
          action => "create"
        }
      }
    }
    
logstashJavaOpts: "-Xmx1g -Xms1g -Dhttp.proxyHost=iusqd.gamora.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=iusqd.gamora.prod -Dhttps.proxyPort=8801"

resources:
  requests:
    memory: "1000Mi"
  limits:
    memory: "1500Mi"

# nodeSelector:
#   logstash: "yes"

httpPort: 9600
extraPorts:
  - name: beats
    containerPort: 5000
  # - name: tcp
  #   containerPort: 5044
  - name: syslog-tcp
    containerPort: 5045
    protocol: TCP
  - name: syslog-udp
    containerPort: 5045
    protocol: UDP

  - name: vault-st-prod
    containerPort: 5064

  - name: debug-tcp
    containerPort: 5077
    protocol: TCP
  - name: debug-udp
    containerPort: 5077
    protocol: UDP

  - name: http-suba
    containerPort: 6968
    protocol: TCP
  - name: http-pier
    containerPort: 6969
    protocol: TCP
  - name: tcp-dev
    containerPort: 6970
    protocol: TCP

service:
  type: NodePort
  externalTrafficPolicy: Local
  # type: LoadBalancer
  # loadBalancerIP: "10.99.185.215"
  ports:
  - name: beats
    nodePort: 30500
    port: 5000
    protocol: TCP
    targetPort: beats
  # - name: tcp
  #   nodePort: 30504
  #   port: 5044
  #   protocol: TCP
  #   targetPort: tcp
  - name: syslog-tcp
    nodePort: 30045
    port: 5045
    protocol: TCP
    targetPort: syslog-tcp
  - name: syslog-udp
    nodePort: 30045
    port: 5045
    protocol: UDP
    targetPort: syslog-udp
  - name: vault-st-prod
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: vault-st-prod

  - name: debug-tcp
    nodePort: 30077
    port: 5077
    protocol: TCP
    targetPort: debug-tcp
  - name: debug-udp
    nodePort: 30077
    port: 5077
    protocol: UDP
    targetPort: debug-udp

  - name: http-suba
    nodePort: 30968
    port: 6968
    protocol: TCP
    targetPort: http-suba
  - name: http-pier
    nodePort: 30969
    port: 6969
    protocol: TCP
    targetPort: http-pier
  - name: tcp-dev
    nodePort: 30970
    port: 6970
    protocol: TCP
    targetPort: tcp-dev