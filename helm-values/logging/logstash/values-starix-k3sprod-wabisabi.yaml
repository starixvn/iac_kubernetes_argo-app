replicas: 2

image: "nexhub.ops-klprod.gamora.prod/kbt/base/logstash/logstash"
imageTag: "8.9.0-opensearch"

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      http {
        port => 8080
        type => "dev-logs"
        tags => ["http"]
        add_field => { "[@metadata][input-http]" => "" }
      }
      tcp {
        port => 5044
        type => "dev-logs"
        tags => ["tcp"]
      }
    }

  dev_filter.conf: |
    filter {
      if [type] == "dev-logs" {
        json { source => "message" }
        useragent {
          source => '[Message][UserAgent]'
          target => "user_agent"
        }
        geoip {
          source => "[Message][IP]"
          target => "geo"
        }
      }
    }

  dev_output.conf: |
    output {
      if [type] == "dev-logs" {
        if "MBTransaction07" in [Tags] {
          opensearch {
            hosts => ["https://opsearch-was-k3sprod:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-mobile-app-login-trans7"
            action => "create"
          }
        }
        else if "Transaction07" in [Tags] {
          opensearch {
            hosts => ["https://opsearch-was-k3sprod:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-login-trans7"
            action => "create"
          }
        }
        else if "FingerprintAttribute" in [Tags] {
          opensearch {
            hosts => ["https://opsearch-was-k3sprod:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-fingerprint-attribute"
            action => "create"
          }
        }
        else {
          opensearch {
            hosts => ["https://opsearch-was-k3sprod:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-dev-unknown-%{+YYYY.MM.dd}"
          }
        }
      }
    }


  main_output.conf: |
    output {
      if [type] not in ["http", "tcp", "dev-logs"] {
        opensearch {
          hosts => ["https://opsearch-was-k3sprod:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }   
      }
    }
    

extraEnvs: []
logstashJavaOpts: "-Xmx4G -Xms4G -Dhttp.proxyHost=iusqd.gamora.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=iusqd.gamora.prod -Dhttps.proxyPort=8801"

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "6Gi"



httpPort: 9600
extraPorts:
- name: httplog
  containerPort: 8080
- name: tcp
  containerPort: 5044

service:
  type: LoadBalancer
  loadBalancerIP: "10.143.58.204"
  ports:
  - name: httplog
    port: 8080
    protocol: TCP
    targetPort: httplog
  - name: tcp
    port: 5044
    protocol: TCP
    targetPort: tcp

nodeSelector:
  opsearch-master: "yes"
  node-role.kubernetes.io/fps-opsearch: ""
  # kubernetes.io/role: "fps-opsearch"
tolerations:
- key: "node.role"
  value: "fps-opsearch"
  operator: Equal
  effect: NoSchedule