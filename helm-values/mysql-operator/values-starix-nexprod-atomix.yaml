---
replicaCount: 3
image:
  repository: hub.nexdev.net/base/bitpoke/mysql-operator
  tag: v0.6.3

resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 128Mi

orchestrator:
  image:
    repository: hub.nexdev.net/base/bitpoke/mysql-operator-orchestrator
    pullPolicy: IfNotPresent
    tag: "v0.6.3"
  persistence:
    accessMode: "ReadWriteOnce"
    storageClass: "longhorn-effort"
    size: 10Gi
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi


### Mysql 
extraObjects:
- apiVersion: v1
  kind: Secret
  metadata:
    name: starix-nexprod-mysql-secret
  type: Opaque
  data:
    ROOT_PASSWORD: "ZklAYWRES20xTXl0QVNnWko=" # FK@dXDsL1MytASgZk
    USER: "bXlzcWwtdXNlcg==" #mysql-user
    PASSWORD: "UGx+VWxoNFlnZlc=" #Pl+Ulh4YgeW
    DATABASE: "bXlzcWwtZGI=" #mysql-db
  
- apiVersion: mysql.presslabs.org/v1alpha1
  kind: MysqlCluster
  metadata:
    name: starix-nexprod-mysql-cluster
  spec:
    replicas: 3
    secretName: starix-nexprod-mysql-secret
    volumeSpec:
      persistentVolumeClaim:
        storageClassName: "longhorn-effort"
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    podSpec:
      resources:
        requests:
          memory: 1Gi
          cpu:    200m
        limits:
          memory: 4Gi
    ### Mysql Backup
    backupSecretName: starix-nexprod-mysql-backup-secret
    # backupSchedule: "0 2 * * *" # daily at 2am
    backupURL: "s3://mysql-opr-backup/"


- apiVersion: v1
  kind: Secret
  metadata:
    name: starix-nexprod-mysql-backup-secret
  type: Opaque
  data:
    AWS_ACCESS_KEY_ID: "nexprod-backup"
    AWS_SECRET_ACCESS_KEY: "3Cc1~TW0jM3K"
    S3_ENDPOINT: "https://s3-api.starixsoft.com"

- apiVersion: mysql.presslabs.org/v1alpha1
  kind: MysqlBackup
  metadata:
    name: starix-nexprod-mysql-backup
  spec:
    clusterName: starix-nexprod-mysql-cluster
