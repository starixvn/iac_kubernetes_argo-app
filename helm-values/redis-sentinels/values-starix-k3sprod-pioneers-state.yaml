clusterDomain: "starix.k3sprod"
useHostnames: false
commonLabels:
  redis-system: pioneers-state
  department: pioneers



global:
  storageClass: "longhorn-effort-2rep"
  imageRegistry: "nexhub.ops-klprod.gamora.prod"

image:
  repository: kbt/base/redis
  tag: 7.2.4-debian-12-r9


metrics:
  image:
    repository: kbt/base/redis-exporter
    tag: 1.58.0-debian-12-r3
  enabled: true
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true


auth:
  password: "foo1@bared"

commonConfiguration: |-
  save 900 1
  save 300 10
  save 60 10000
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec


volumePermissions:
  enabled: true
  image:
    repository: kbt/base/os-shell
    tag: 12-debian-12-r16

master:
  persistence:
    size: 10Gi

sentinel:
  enabled: true
  image:
    registry: 
    repository: kbt/base/redis-sentinel
    tag: 7.2.4-debian-12-r7
  persistence:
    size: 1Gi    

replica:
  replicaCount: 3
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1024Mi"
    limits:
      memory: "3072Mi"
  nodeSelector:
    redis-node: "yes"
  tolerations:
  - effect: NoSchedule
    key: redis-node
    value: "yes"

