clusterDomain: "starix.k3suat"
useHostnames: false
commonLabels:
  redis-system: wabisabi-cache
  department: wabisabi



global:
  storageClass: "longhorn-effort-2rep"
  imageRegistry: "nexhub.ops-klprod.gamora.prod"

image:
  repository: kbt/base/redis
  tag: 7.2.4-debian-12-r9


metrics:
  image:
    repository: kbt/base/redis-exporter
    tag: 1.58.0-debian-12-r3
  enabled: true
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true


auth:
  password: "foo1@bared"

commonConfiguration: |-
  save 900 1
  save 300 10
  save 60 10000
  appendonly yes
  appendfilename "appendonly.aof"
  appendfsync everysec


volumePermissions:
  enabled: true
  image:
    repository: kbt/base/os-shell
    tag: 12-debian-12-r16

master:
  persistence:
    size: 30Gi

sentinel:
  enabled: true
  image:
    registry: 
    repository: kbt/base/redis-sentinel
    tag: 7.2.4-debian-12-r7
  persistence:
    size: 5Gi    

replica:
  replicaCount: 3
  persistence:
    size: 30Gi
  resources:
    requests:
      cpu: "1.0"
      memory: "3072Mi"
    limits:
      memory: "12288Mi"
  nodeSelector:
    redis-node: "yes"
  tolerations:
  - effect: NoSchedule
    key: redis-node
    value: "yes"

