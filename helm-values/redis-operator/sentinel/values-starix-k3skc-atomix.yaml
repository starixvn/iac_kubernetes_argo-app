---
redisSentinel:
  name: ""
  clusterSize: 3
  image: quay.io/opstree/redis-sentinel
  tag: v8.2.1
  imagePullPolicy: IfNotPresent
  redisSecret:
    secretName: "redis-kc-secret"
    secretKey: "redis-password"
  serviceType: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi

labels:
  app: redis-kc-testlab-sentinel

redisSentinelConfig:
  redisReplicationName: "redis-kc-testlab-rep"
  redisReplicationPassword:
    secretName: "redis-kc-secret"
    secretKey: "redis-password"
  parallelSyncs: "1"
  downAfterMilliseconds: "5000"
  quorum: "2"
  failoverTimeout: "10000"


pdb:
  enabled: true
  minAvailable: 2



initContainer:
  enabled: true
  image: ""
  imagePullPolicy: "IfNotPresent"


serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  extraLabels:
    app: redis-kc-testlab-sentinel


redisExporter:
  enabled: true
  image: hub.nexdev.net/base/opstree/redis-exporter
  tag: "v1.44.0"
  imagePullPolicy: IfNotPresent
  resources: {}

nodeSelector:
  redis-node: "yes" # only schedule on nodes dont run redis

tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - redis-kc-testlab-sentinel
        topologyKey: "kubernetes.io/hostname"



