---
redisOperator:
  name: redis-operator
  imageName: nexhub.ops.strawberry.com/aws/base/opstree/redis-operator
  imageTag: "v0.22.1"
  imagePullPolicy: Always

  podLabels:
    app: redis-operator

replicas: 3

resources:
  requests:
    cpu: 500m
    memory: 500Mi

nodeSelector:
  haproxy: "yes"

tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - redis-operator
        topologyKey: "kubernetes.io/hostname"


