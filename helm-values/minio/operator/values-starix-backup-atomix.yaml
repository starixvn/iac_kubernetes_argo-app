---
operator:
  image:
    repository: hub.nexdev.net/base/minio/operator
    sidecarImage:
      repository: hub.nexdev.net/base/minio/operator-sidecar

  env:
  - name: MINIO_OPERATOR_RUNTIME
    value: "Rancher"
  - name: CLUSTER_DOMAIN
    value: "starix.backup"
  - name: PROMETHEUS_NAMESPACE
    value: "monitoring"

  replicaCount: 2

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
      ephemeral-storage: 500Mi
