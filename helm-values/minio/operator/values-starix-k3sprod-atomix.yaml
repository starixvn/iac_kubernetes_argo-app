---
operator:
  image:
    repository: nexhub.ops-klprod.gamora.prod/kbt/base/minio/operator
  sidecarImage:
    repository: nexhub.ops-klprod.gamora.prod/kbt/base/minio/operator-sidecar

  env:
  - name: MINIO_OPERATOR_RUNTIME
    value: "Rancher"
  - name: CLUSTER_DOMAIN
    value: "starix.k3sprod"
  - name: PROMETHEUS_NAMESPACE
    value: "monitoring"

  replicaCount: 2

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
      ephemeral-storage: 500Mi
