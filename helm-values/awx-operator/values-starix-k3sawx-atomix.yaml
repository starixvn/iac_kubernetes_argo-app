AWX:
  # enable use of awx-deploy template
  enabled: true
  name: awx
  spec:
    ipv6_disabled: true
    postgres_data_volume_init: true
    ingress_type: "ingress"
    projects_persistence: true
    projects_storage_access_mode: ReadWriteOnce
    ingress_class_name: "traefik"
    ingress_hosts:
    - hostname: "awx-k3s.nexdev.net"
      tls_secret: awx-k3s-tls-secret
    csrf_cookie_secure: "False"
    session_cookie_secure: "False"
    ee_extra_volume_mounts: |
      - name: k8s-caching
        mountPath: /caching-k8s-dir
    web_extra_volume_mounts: |
      - name: static-data
        mountPath: /var/lib/projects
    extra_volumes: |
      - name: static-data
        persistentVolumeClaim:
          claimName: static-data-pvc
      - name: k8s-caching
        persistentVolumeClaim:
          claimName: k8s-caching-pvc
    extra_settings:
    - setting: CSRF_TRUSTED_ORIGINS
      value:
        - https://awx-k3s.nexdev.net

extraDeploy:
- |
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: static-data-pvc
    namespace: awx
  spec:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 5Gi
- |
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: k8s-caching-pvc
    namespace: awx
  spec:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 10Gi
- |
  # Create a TLS secret named `awx-k3s-tls-secret` in the `awx` namespace before deploying AWX.
  apiVersion: v1
  kind: Secret
  metadata:
    name: awx-k3s-tls-secret
    namespace: awx
  type: kubernetes.io/tls
  data:
    tls.crt: 
    tls.key: 




