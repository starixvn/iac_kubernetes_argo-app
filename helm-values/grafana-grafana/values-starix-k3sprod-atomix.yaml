- apiVersion: mysql.presslabs.org/v1alpha1
  kind: MysqlCluster
  metadata:
    name: starix-mysql-graf-cluster
  spec:
    replicas: 3
    secretName: starix-mysql-graf-cluster-secret
    volumeSpec:
      persistentVolumeClaim:
        storageClassName: "longhorn-effort-2rep"
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    podSpec:
      resources:
        requests:
          memory: 1Gi
          cpu:    200m
        limits:
          memory: 4Gi

