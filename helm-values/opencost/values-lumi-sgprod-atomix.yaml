nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterName: "cluster.local"

loglevel: debug

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: 
  #eks.amazonaws.com/role-arn: arn:aws:iam::014999276089:role/vn-nx-opencost
  automountServiceAccountToken: true
  name: "opencost-atx-sgprod"

networkPolicies:
  enabled: true
  prometheus:
    namespace: monitoring
    port: 9090
    labels:
      app.kubernetes.io/name: prometheus

  extraEgress: []

service:
  enabled: true
  annotations: {}
  labels: {}
  type: ClusterIP
  port: 9003
  # nodePort: 30093
  extraPorts: []
  loadBalancerSourceRanges: []

rbac:
  enabled: true

opencost:
  cloudIntegrationSecret: ""
  # cloudCost:
  #   enabled: true
  exporter:
    apiPort: 9003
    cloudProviderApiKey: ""
    defaultClusterId: 'cluster.local'
    image:
      registry: lumhub.sc-t1prod.gamora.prod/aws/base
      repository: opencost
      tag: "1.115.0"
      pullPolicy: IfNotPresent
      fullImageName: null
    extraEnv:
      CLUSTER_ID: "lumi.sgprod"
      # CLOUD_COST_ENABLED: "true"
      # AWS_CUR_INTEGRATION: "athena"
      # AWS_CUR_PATH: "s3://vn-lumi-starix-tf-state/opencost-cur-results/"
      # CLOUD_PROVIDER: "AWS"

    extraArgs: []
    command: []
    replicas: 1
    resources:
      requests:
        cpu: '10m'
        memory: '55Mi'
      limits:
        memory: '1Gi'
    startupProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    securityContext: {}

    csv_path: ""

    prometheusDataSource:
      queryResolutionSeconds: 300

    collectorDataSource:
      enabled: false
      scrapeInterval: 30s
      networkPort: 3001
      retentionResolution10m: 36
      retentionResolution1h: 49
      retentionResolution1d: 15

    persistence:
      enabled: false
      mountPath: /mnt/export
      annotations: {}
      accessMode: "ReadWriteOnce"
      storageClass: "local-path"
      size: "1Gi"

    apiIngress:
      enabled: false
      ingressClassName: ""
      annotations: {}
      hosts:
        - host: example.local
          paths:
            - path: /
              pathType: Prefix
      servicePort: http
      tls: []

  customPricing:
    enabled: true
    configmapName: custom-pricing-model
    configPath: /tmp/custom-config
    createConfigmap: true
    provider: aws
    costModel:
      description: "Custom pricing configuration for lumi.sgprod environment"
      region: "ap-southeast-1"
      zone: "default-zone"
      # CPU: 0.008333      # USD / vCPU / h
      # RAM: 0.002778      # USD / GB RAM / h
      # storage: 0.019444  # USD / GB disk / h
      # LoadBalancerCost: 0.0
      # LBIngressDataCost: 0.00
      # FirstFiveForwardingRulesCost: 0.0
      # AdditionalForwardingRuleCost: 0.0

      athenaBucketName: "s3://vn-lumi-starix-tf-state/opencost-cur-results/"
      athenaDatabase: "athenacurcfn_nx_opencost_cur"
      athenaProjectID: "014999276089"
      athenaRegion: "ap-southeast-1"
      athenaTable: "nx_opencost_cur"
      athenaWorkgroup: primary

  dataRetention:
    dailyResolutionDays: 15

  cloudCost:
    # -- Enable cloud cost ingestion and querying, dependant on valid integration credentials
    enabled: true
    # -- Number of hours between each run of the Cloud Cost pipeline
    refreshRateHours: 1
    # -- Number of days into the past that a Cloud Cost standard run will query for
    runWindowDays: 3
    # -- The number of standard runs before a Month-to-Date run occurs
    monthToDateInterval: 6
    # -- The max number of days that any single query will be made to construct Cloud Costs
    queryWindowDays: 7

  metrics:
    kubeStateMetrics:
      emitPodAnnotations: ~
      emitNamespaceAnnotations: ~
      emitKsmV1Metrics: ~
      emitKsmV1MetricsOnly: ~

    serviceMonitor:
      enabled: true
      additionalLabels: {}
      namespace: "monitoring"
      scrapeInterval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings: []
      metricRelabelings: []
      extraEndpoints: []
      scheme: http
      tlsConfig: {}

    config:
      enabled: true
      configmapName: custom-metrics
      disabledMetrics: []

  prometheus:
    secret_name: ~
    existingSecretName: ~
    username: ""
    username_key: DB_BASIC_AUTH_USERNAME
    password: ""
    password_key: DB_BASIC_AUTH_PW
    bearer_token: ""
    bearer_token_key: DB_BEARER_TOKEN
    kubeRBACProxy: false
    external:
      enabled: false
      url: ""
    internal:
      enabled: true
      serviceName: prometheus-atx-sgprod-kube-prometheus
      namespaceName: monitoring
      port: 9090
      scheme: http

  ui:
    enabled: false
    image:
      registry: lumhub.sc-t1prod.gamora.prod/aws/base
      repository: opencost/opencost-ui
      tag: "1.115.0@sha256:d544b2f16b76540606acb3d25e029e368611feb2751b86cb5903b0212b75a71e"
      pullPolicy: IfNotPresent
      fullImageName: null
    resources:
      requests:
        cpu: '10m'
        memory: '55Mi'
      limits:
        memory: '1Gi'
    uiPort: 9090
    useIPv6: true
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    securityContext: {}

    extraEnv: []

    extraVolumeMounts: []

    useDefaultFqdn: false

    ingress:
      enabled: false
      ingressClassName: "haproxy"
      annotations: {}
      hosts:
        - host: ""
          paths:
            - /
      servicePort: http-ui
      tls: []
    route:
      enabled: false
      annotations: {}
      host: example.local
      path:
      targetPort: http-ui
      tls: []
