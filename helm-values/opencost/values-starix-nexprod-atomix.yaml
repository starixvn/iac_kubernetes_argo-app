opencost:
  cloudIntegrationSecret: ""
  exporter:
    enabled: false
    apiPort: 9003
    cloudProviderApiKey: ""
    defaultClusterId: "default"
    image:
      registry: ghcr.io
      repository: opencost/opencost
      tag: "1.115.0@sha256:fb6468a1ef45dbd4a9e521122c8d306f882bb33d1657d28d21aeaef79412e9e1"
      pullPolicy: IfNotPresent
      fullImageName: null
    extraArgs: []
    command: []
    replicas: 1
    resources:
      requests:
        cpu: '10m'
        memory: '55Mi'
      limits:
        memory: '1Gi'
    startupProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    securityContext: {}

    csv_path: ""

    prometheusDataSource:
      queryResolutionSeconds: 300
    collectorDataSource:
      enabled: false
      scrapeInterval: 30s
      networkPort: 3001
      retentionResolution10m: 36
      retentionResolution1h: 49
      retentionResolution1d: 15

    persistence:
      enabled: true
      mountPath: /mnt/export
      annotations: {}
      accessMode: "ReadWriteOnce"
      storageClass: "longhorn"
      size: "1Gi"

    apiIngress:
      enabled: false
      ingressClassName: ""
      annotations: {}
      hosts:
        - host: example.local
          paths:
            - path: /
              pathType: Prefix
      servicePort: http
      tls: []

  customPricing:
    enabled: true
    configmapName: custom-pricing-model
    configPath: /tmp/custom-config
    createConfigmap: true
    provider: custom
    costModel:
      description: "Custom pricing configuration for starix.nexprod environment"
      region: "on-prem"
      zone: "default-zone"
      CPU: 0.024
      RAM: 0.005
      storage: 0.04
      LoadBalancerCost: 0.0
      LBIngressDataCost: "0.01"
      FirstFiveForwardingRulesCost: "0.0"
      AdditionalForwardingRuleCost: "0.0"

  dataRetention:
    dailyResolutionDays: 15


  metrics:
    kubeStateMetrics:
      emitPodAnnotations: ~
      emitNamespaceAnnotations: ~
      emitKsmV1Metrics: ~
      emitKsmV1MetricsOnly: ~

    serviceMonitor:
      enabled: true
      additionalLabels: {}
      namespace: "monitoring"
      scrapeInterval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings: []
      metricRelabelings: []
      extraEndpoints: []
      scheme: http
      tlsConfig: {}

    config:
      enabled: false
      configmapName: custom-metrics
      disabledMetrics: []

  prometheus:
    secret_name: ~
    existingSecretName: ~
    username: ""
    username_key: DB_BASIC_AUTH_USERNAME
    password: ""
    password_key: DB_BASIC_AUTH_PW
    bearer_token: ""
    bearer_token_key: DB_BEARER_TOKEN
    kubeRBACProxy: false
    external:
      enabled: true
      url: "http://10.18.200.193:30062/"
    internal:
      enabled: false
      serviceName: prometheus-starix-nexprod-prometheus
      namespaceName: monitoring
      port: 9090
      scheme: http

  ui:
    enabled: true
    image:
      registry: ghcr.io
      repository: opencost/opencost-ui
      tag: "1.115.0@sha256:d544b2f16b76540606acb3d25e029e368611feb2751b86cb5903b0212b75a71e"
      pullPolicy: IfNotPresent
      fullImageName: null
    resources:
      requests:
        cpu: '10m'
        memory: '55Mi'
      limits:
        memory: '1Gi'
    uiPort: 9090
    useIPv6: true
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    securityContext: {}

    extraEnv: []

    extraVolumeMounts: []

    useDefaultFqdn: false

    ingress:
      enabled: true
      ingressClassName: "haproxy"
      annotations: {}
      hosts:
        - host: opencost.nexdev.net
          paths:
            - /
      servicePort: http-ui
      tls: []
    route:
      enabled: false
      annotations: {}
      host: example.local
      path:
      targetPort: http-ui
      tls: []
