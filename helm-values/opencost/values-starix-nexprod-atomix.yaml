nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterName: "default"

loglevel: info

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  automountServiceAccountToken: true

networkPolicies:
  enabled: true
  prometheus:
    namespace: monitoring
    port: 9090
    labels:
      app.kubernetes.io/name: prometheus

  extraEgress: []

service:
  enabled: true
  annotations: {}
  labels: {}
  type: ClusterIP
  port: 9003
  # -- NodePort if service type is NodePort
  #nodePort: 30888
  extraPorts: []
    # - name: oauth-proxy
    #   port: 8081
    #   targetPort: 8081
    # - name: oauth-metrics
    #   port: 8082
    #   targetPort: 8082
  # -- LoadBalancer Source IP CIDR if service type is LoadBalancer and cloud provider supports this
  loadBalancerSourceRanges: []

