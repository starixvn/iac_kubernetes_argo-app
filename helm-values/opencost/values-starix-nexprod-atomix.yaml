clusterName: "starix.nexprod"
loglevel: info

networkPolicies:
  enabled: true
  prometheus:
    namespace: monitoring
    port: 9090
  extraEgress: []

podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000

service:
  enabled: true
  annotations: {}
  labels: {}
  type: NodePort
  nodePort: 30888
  extraPorts: []
    # - name: oauth-proxy
    #   port: 8081
    #   targetPort: 8081
    # - name: oauth-metrics
    #   port: 8082
    #   targetPort: 8082
  # -- LoadBalancer Source IP CIDR if service type is LoadBalancer and cloud provider supports this
  loadBalancerSourceRanges: []

opencost:
  cloudIntegrationSecret: ""
  exporter:
    apiPort: 9003
    cloudProviderApiKey: ""
    defaultClusterId: 'default-cluster'
    image:
    replicas: 1
    resources:
      requests:
        cpu: '50m'
        memory: '128Mi'
      limits:
        cpu: '200m'
        memory: '512Mi'
    startupProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    csv_path: ""

    prometheusDataSource:
      queryResolutionSeconds: 300

    collectorDataSource:
      enabled: false
      scrapeInterval: 30s
      networkPort: 3001
      retentionResolution10m: 36
      retentionResolution1h: 49
      retentionResolution1d: 15

    persistence:
      enabled: true
      mountPath: /mnt/export
      annotations: {}
      accessMode: "ReadWriteOnce"
      storageClass: "longhorn"
      size: "1Gi"

  customPricing:
    enabled: true
    configmapName: custom-pricing-model
    configPath: /tmp/custom-config
    createConfigmap: true
    provider: custom
    # -- More information about these values here: https://www.opencost.io/docs/configuration/on-prem#custom-pricing-using-the-opencost-helm-chart
    costModel:
      description: "Custom pricing configuration for starix.nexprod environment"
      CPU: "0.06"
      spotCPU: "0.006"
      RAM: "0.01"
      spotRAM: "0.001"
      storage: "0.04"
      zoneNetworkEgress: "0.01"
      regionNetworkEgress: "0.01"
      internetNetworkEgress: "0.12"
      LoadBalancerCost: "0.025"

  dataRetention:
    dailyResolutionDays: 15

  prometheus:
    secret_name: ~
    existingSecretName: ~
    username: ""
    username_key: DB_BASIC_AUTH_USERNAME
    password: ""
    password_key: DB_BASIC_AUTH_PW
    bearer_token: ""
    bearer_token_key: DB_BEARER_TOKEN
    kubeRBACProxy: false
    external:
      enabled: false
      url: "https://prometheus.example.com/prometheus"
    internal:
      enabled: true
      serviceName: prometheus-starix-nexprod-prometheus
      namespaceName: monitoring
      port: 9090
      scheme: http

  ui:
    enabled: true
    image:
      registry: ghcr.io
      repository: opencost/opencost-ui
      tag: "1.115.0@sha256:d544b2f16b76540606acb3d25e029e368611feb2751b86cb5903b0212b75a71e"
      pullPolicy: IfNotPresent
      fullImageName: null
    resources:
      requests:
        cpu: '50m'
        memory: '128Mi'
      limits:
        cpu: '200m'
        memory: '512Mi'
    uiPort: 9090
    useIPv6: true
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    ingress:
      enabled: true
      ingressClassName: "haproxy"
      annotations: {}
      hosts:
        - host: opencost.nexdev.net
          paths:
            - /
      servicePort: http-ui
      tls: []
