clusterDomain: starix.k3suat
useHostnames: false


global:
  storageClass: "longhorn-effort-2rep"
  imageRegistry: "nexhub.ops-klprod.gamora.prod"
  security:
    allowInsecureImages: true


image:
  repository: kbt/base/bitnami/redis-stack-server
  tag: 7.4.0-v6-was



metrics:
  image:
    repository: kbt/base/redis-exporter
    tag: 1.58.0-debian-12-r3
  enabled: true
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true


auth:
  password: "foo1@bared"

volumePermissions:
  enabled: true
  image:
    repository: kbt/base/os-shell
    tag: 12-debian-12-r16

master:
  persistence:
    size: 30Gi
  resources:
    requests: 
      memory: 2Gi
    limits:
      memory: 4Gi
  service:
    type: NodePort
    nodePorts:
      redis: "30539"



replica:
  replicaCount: 3
  persistence:
    size: 30Gi
  resources:
    requests:
      memory: "2Gi"
    limits:
      memory: "4Gi"
  service:
    type: NodePort
    nodePorts:
      redis: "30108"
