image:
  registry: lumhub.ops-dr.nebula.prod/kbt/base
  repository: bitnami/elasticsearch
  tag: 8.14.3-debian-12-r4

service:
  type: NodePort
  ports:
    restAPI: 9200
    transport: 9300
  nodePorts:
    restAPI: "30920"
    transport: "30930"

ingress:
  enabled: true
  pathType: ImplementationSpecific
  apiVersion: ""
  hostname: jaeger-elasticsearch-sc.ops-dr.nebula.prod
  path: /
  ingressClassName: "haproxy"

master:
  persistence:
    enabled: true
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
