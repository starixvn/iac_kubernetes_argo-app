image:
  registry: docker.io
  repository: bitnami/elasticsearch
  tag: 8.14.3-debian-12-r4

service:
  type: NodePort
  ports:
    restAPI: 9200
    transport: 9300
  nodePorts:
    restAPI: "30920"
    transport: "30930"

ingress:
  enabled: true
  pathType: ImplementationSpecific
  apiVersion: ""
  hostname: jaeger-elasticsearch.lumigame.com
  path: /
  ingressClassName: "haproxy"

master:
  persistence:
    enabled: true
    storageClass: longhorn
    accessModes:
      - ReadWriteOnce
    size: 30Gi
