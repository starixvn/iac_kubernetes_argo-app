# Custom values for Grafana Mimir with external MinIO
# Basic production-ready configuration

# Disable built-in MinIO as we're using external
minio:
  enabled: false


image:
  repository: hub.nexdev.net/base/grafana/mimir
  tag: 2.17.0
  pullPolicy: IfNotPresent

global:
  dnsService: kube-dns
  dnsNamespace: kube-system
  clusterDomain: starix.nexprod.

mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          bucket_name: "mimir-promtheus-longterm"
          endpoint: "s3-api.starixsoft.com:443"
          access_key_id: "grafana-mimir"
          secret_access_key: "n@MyH#eMG7b6uMu_UUwu"
    limits:
      max_global_series_per_user: 2500000
      ingestion_rate: 160000         # items/second (samples+exemplars+metadata)
      ingestion_burst_size: 12000000    # max burst across all distributors



alertmanager:
  enabled: false

ruler:
  enabled: false


distributor:
  replicas: 3
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi

  
ingester:
  zoneAwareReplication:
    enabled: false
  enabled: true
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  replicas: 3
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  persistentVolume:
    enabled: true
    size: 20Gi  # Sufficient for 1.5M series
    storageClass: "longhorn-effort"




compactor:
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  enabled: true
  persistentVolume:
    enabled: true
    size: 20Gi  # Sufficient for 1.5M series
    storageClass: "longhorn-effort"
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi


store_gateway:
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  enabled: true
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: "longhorn-effort"
  replicas: 3    
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 4Gi

querier:
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  enabled: true
  replicas: 3

query_frontend:
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0
  enabled: true
  replicas: 3

query_scheduler:
  enabled: true
  image:
    repository: hub.nexdev.net/base/grafana/mimir
    # tag: 2.16.0


memcached:
  image:
    repository: memcached
    tag: 1.6.38-alpine
    pullPolicy: IfNotPresent



# Enable metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

nginx:
  image:
    registry: docker.io
    repository: nginxinc/nginx-unprivileged
    tag: 1.28-alpine
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    ingressClassName: haproxy
    hosts:
      - host: nginx-mimir.nexdev.net
        paths:
          - path: /
            pathType: Prefix

ingress:
  enabled: true
  ingressClassName: haproxy
  hosts:
    - nginx-mimir.nexdev.net



