---
# clusterDomain: lumi.prod

global:
  imageRegistry: "lumhub.sc-t1prod.gamora.prod/aws/base"

operator:
  enabled: true

prometheus:
  nodeSelector:
    nexops-mon: "yes"
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"
  ingress:
    enabled: true
    ingressClassName: "haproxy"
    pathType: ImplementationSpecific
    hostname: prometheus-eks-sgdr.sportsfun.app
    path: /

  retention: 7d
  retentionSize: "25GB"

  persistence:
    enabled: true
    size: 30Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  #resourcesPreset: "xlarge"

  # resources:
  #   requests:
  #     cpu: 500m
  #     memory: 1Gi
  #   limits:
  #     cpu: 1
  #     memory: 4Gi

  additionalScrapeConfigs:
    enabled: false
    type: internal
    external:
      name: ""
      key: ""
    internal:
      jobList:
        - job_name: "cloud-costs-exporter"
          metrics_path: "/metrics"
          scrape_interval: 30s
          scrape_timeout: 10s
          scheme: "http"
          static_configs:
            - targets: ["cloud-costs-exporter.tf-atx-opencost.svc:8080"]
  ###

kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    nexops-mon: "yes"

