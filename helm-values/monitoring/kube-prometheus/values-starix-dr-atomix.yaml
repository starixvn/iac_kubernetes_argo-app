---
clusterDomain: starix.dr

global:
  imageRegistry: "nexhub.ops-dr.nebula.prod/kbt/base"

operator:
  enabled: true

prometheus:
  # nodeSelector:
  #   nexops-tools: "yes"
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"
  ingress:
    enabled: true
    ingressClassName: "ingress-nap"
    pathType: ImplementationSpecific
    hostname: prometheus-st.dr.starixplay.com
    path: /

  retention: 7d
  retentionSize: "50GB"

  persistence:
    enabled: true
    size: 20Gi

  resourcesPreset: "xlarge"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      name: ""
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""
  
  #additionalPrometheusRules: []

kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    nexops-tools: "yes"

