---
clusterDomain: starix.k3suat

global:
  imageRegistry: "nexhub.ops-klprod.gamora.prod/kbt/base"

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 7d
  retentionSize: "90GiB"

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 25Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resources:
    requests:
      memory: "4096Mi"
    limits:
      memory: "8192Mi"

  additionalScrapeConfigs:
    enabled: true
    type: internal
    internal:
      jobList: []

  #additionalPrometheusRules:

node-exporter:
  extraVolumes:
    - hostPath:
        path: /var/lib
        type: ""
      name: mnt

  extraVolumeMounts:
    - mountPath: /host/root/var/lib
      mountPropagation: HostToContainer
      name: mnt
      readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"

alertmanager:
  resourcesPreset: "none"
  enabled: true

  config:
    global:
      resolve_timeout: 15m
      http_config:
        proxy_url: "http://iusqd.gamora.prod:8801"

    route:
      receiver: "default-receiver"
      routes:
        - receiver: "null"
          match_re:
            pod: "c-.*|.*-cleaner-.*|.*snapshot-.*|.*-cleanup-.*|.*-cron-.*|.*-update-.*|.*consumer.*|.*backup.*"
        - receiver: 'null'
          match_re:
            namespace: "logging"
            alertname: "Kubernetes Pod Restart"
        - receiver: 'null'
          match_re:
            cronjob: ".*trim.*"
        - receiver: 'alert-nx-atomix'
          match_re:
            alertname: "Kubernetes Cluster Pod Usage Above 80%"
        - receiver: "alert-nx-atomix-uat"
          match_re:
            alertname: "Kubernetes.*"
        - receiver: "alert-velero-backups"
          match_re:
            alertname: "Velero.*"
        - receiver: "longhorn_alerts"
          match:
            service: "Longhorn"
          group_by: ["alertname", "job", "pvc"]
      group_by: ["alertname", "job", "pod", "description"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
      - name: "null"
      - name: "longhorn_alerts"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#longhorn_alerts"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥PROBLEM🔥 {{ else }}✅RESOLVED✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-KLUAT`
              *Severity:* `{{ .CommonLabels.severity }}`{{ if .CommonLabels.pvc }}
              *PVC:* `{{ .CommonLabels.pvc }}`{{ end }}{{ if .CommonLabels.pvc_namespace }}
              *Namespace:* `{{ .CommonLabels.pvc_namespace }}`{{ end }}{{ if .CommonAnnotations.description }}
              *Description:* `{{ .CommonAnnotations.description }}`{{ end }}

      - name: "alert-nx-atomix-uat"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#alert-nx-atomix-uat"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: >-
              {{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}
              {{- if match "(?i)cpu" .CommonLabels.alertname }} :cpu_1: CPU PROBLEM
              {{- else if match "(?i)memory" .CommonLabels.alertname }} :memory_1: MEMORY PROBLEM
              {{- else if match "(?i)disk" .CommonLabels.alertname }} :disk: DISK PROBLEM 
              {{- else if match "(?i)node" .CommonLabels.alertname }} :server: NODE PROBLEM
              {{- else if match "(?i)pod" .CommonLabels.alertname }} :pod: POD PROBLEM
              {{- else if match "(?i)service" .CommonLabels.alertname }} ⚙️ SERVICE PROBLEM
              {{- else if match "(?i)http" .CommonLabels.alertname }} 🌐 HTTP PROBLEM
              {{- else if match "(?i)bandwidth" .CommonLabels.alertname }} 🌐 BANDWIDTH PROBLEM
              {{- else if match "(?i)haproxy" .CommonLabels.alertname }} 🌐 HAPROXY PROBLEM
              {{- else if match "(?i)api" .CommonLabels.alertname }} :kubernetes-api: KUBERNETES API PROBLEM
              {{- else }} {{ if eq .Status "firing" }} PROBLEM {{ else }} RESOLVED {{ end }}
              {{ end }}
              {{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}
            text: |
              *Cluster:* `Kubernetes-DevOps-KLUAT`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'
      
      - name: 'alert-nx-atomix'
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: '#alert-nx-atomix'
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-KLUAT`
              *Summary:* `{{ .CommonLabels.alertname }}`
              *Description:* `{{ .CommonAnnotations.description }}`
            color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

      - name: "alert-velero-backups"
        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#alert-velero-backups"
            send_resolved: true
            icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
            text: |
              *Cluster:* `Kubernetes-DevOps-KLUAT`
              ❗ *{{ .CommonLabels.severity }}*
              📝 *{{ .CommonAnnotations.message }}*

      - name: default-receiver

blackboxExporter:
  dnsPolicy: "ClusterFirstWithHostNet"
  hostNetwork: true
  dnsConfig:
    nameservers:
      - 10.144.50.5
    searches:
      - gamora.prod
    options:
      - name: ndots
        value: "5"
  configuration: |
    modules:
      tcp_connect:
        prober: tcp
        tcp:
          preferred_ip_protocol: "ip4"
      dns_probe:
        prober: dns
        dns:
          query_name: "iusqd.gamora.prod"
          query_type: "A"
          valid_rcodes:
            - NOERROR
          preferred_ip_protocol: "ip4"
          source_ip_address: "10.144.50.5"  # Changed from dns_server to source_ip_address

