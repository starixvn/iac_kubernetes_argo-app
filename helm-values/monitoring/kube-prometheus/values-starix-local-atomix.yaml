---
clusterDomain: starix.local

global:
  imageRegistry: "hub.nexdev.net/base"

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"
  retention: 7d
  retentionSize: "40GB"
  persistence:
    enabled: true
    size: 30Gi

  # remoteWrite:
  #   - url: http://nginx-mimir.nexdev.net/api/v1/push
  #     headers:
  #       X-Scope-OrgID: "starix-local"
  #     retry_on_http_429: true

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "none"
  
kube-state-metrics:
  resourcesPreset: "none"

alertmanager:
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      http_config:
        proxy_url: "http://proxysqd.nexdev.net:3128"

    route:
      receiver: "default-receiver"
      routes:
      - receiver: "null"
        match_re:
          alertname: "Kubernetes Pod Restart|.*Pod.*|HAProxy.*|.*usage exceeds.*"
      - receiver: 'null'
        match_re:
          cronjob: ".*trim.*"
      - receiver: 'alert-nx-atomix'
        match_re:
          alertname: "Kubernetes Cluster Pod Usage Above 80%.*"
      - receiver: 'alert-nx-atomix-local'
        match_re:
          alertname: "Kubernetes.*"
      # - receiver: "velero_alerts"
      #   match:
      #     service: "Velero.*"
      - receiver: dev-services
        match:
          service: "OpenSearch"
        group_by: ['alertname', 'job']
      # - receiver: kubescape-notify
      #   match:
      #     alertname: "KubescapeRuleViolated"
      #   group_by: ['namespace', 'container_name', 'rule_name']
      group_by: ["alertname", "cluster", "namespace", "pod", "description", 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
    - name: 'null'
    - name: 'alert-nx-atomix-local'
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: '#alert-nx-atomix-local'
        send_resolved: true
        icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
        title: >-
          {{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}
          {{- if match "(?i)cpu" .CommonLabels.alertname }} :cpu_1: CPU
          {{- else if match "(?i)memory" .CommonLabels.alertname }} :memory_1: MEMORY
          {{- else if match "(?i)disk" .CommonLabels.alertname }} :disk: DISK
          {{- else if match "(?i)node" .CommonLabels.alertname }} :server: NODE
          {{- else if match "(?i)pod" .CommonLabels.alertname }} :pod: POD
          {{- else if match "(?i)service" .CommonLabels.alertname }} ⚙️ SERVICE
          {{- else if match "(?i)http" .CommonLabels.alertname }} 🌐 HTTP
          {{- else if match "(?i)bandwidth" .CommonLabels.alertname }} 🌐 BANDWIDTH
          {{- else if match "(?i)haproxy" .CommonLabels.alertname }} 🌐 HAPROXY
          {{- else if match "(?i)api" .CommonLabels.alertname }} :kubernetes-api: KUBERNETES API
          {{ end }}
          {{ if eq .Status "firing" }} PROBLEM :fire:{{ else }} RESOLVED :white_check_mark:{{ end }}
        text: |
          *Cluster:* `Kubernetes-ST-Local`
          *Problem:* `{{ .CommonLabels.alertname }}`
          *Description:* `{{ .CommonAnnotations.description }}`
        color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

    - name: 'alert-nx-atomix'
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: '#alert-nx-atomix'
        send_resolved: true
        icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
        title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
        text: |
          *Cluster:* `Kubernetes-ST-Local`
          *Problem:* `{{ .CommonLabels.alertname }}`
          *Description:* `{{ .CommonAnnotations.description }}`
        color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'


    - name: dev-services
      slack_configs:
      - channel: "#dev-services"
        api_url: "https://slack.com/api/chat.postMessage"
        color: '{{ template "sre.slack.color" . }}'
        fallback: '{{ template "sre.slack.fallback" . }}'
        http_config:
          bearer_token_file: /etc/alertmanager/secrets/alertmanager-secrets/nexopscopbot_bearer_token
        icon_emoji: '{{ template "sre.slack.iconemoji" . }}'
        send_resolved: true
        username: '{{ template "sre.slack.username" . }}🔹ST.LOCAL'
        title: '{{ template "sre.slack.title" . }}'
        text: '{{ template "sre.slack.body" . }}'

    # - name: kubescape-notify
    #   slack_configs:
    #   - channel: "#alert-josh-test"
    #     color: '{{ template "sre.slack.color" . }}'
    #     fallback: '{{ template "sre.slack.fallback" . }}'
    #     icon_emoji: '{{ template "sre.slack.iconemoji" . }}'
    #     send_resolved: false
    #     username: '{{ template "sre.slack.username" . }}🔹ST.LOCAL'
    #     title: '{{ template "kubescape.slack.title" . }}'
    #     text: '{{ template "sre.slack.body" . }}'

    - name: default-receiver

node-exporter:
  extraVolumes:
  - hostPath:
      path: /var/lib
      type: ""
    name: mnt
    
  extraVolumeMounts:
  - mountPath: /host/root/var/lib
    mountPropagation: HostToContainer
    name: mnt
    readOnly: true

  extraArgs:
    path.rootfs: "/host/root"
    collector.filesystem.mount-points-exclude: "^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    collector.filesystem.fs-types-exclude: "^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs|squashfs|nsfs|tmpfs)$"
