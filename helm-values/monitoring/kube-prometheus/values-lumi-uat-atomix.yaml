---
clusterDomain: lumi.uat

global:
  imageRegistry: "lumhub.ops-klprod.gamora.prod/kbt/base"

operator:
  enabled: true

prometheus:
  nodeSelector:
    nexops-tools: "yes"
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 3d
  retentionSize: "18GB"

  persistence:
    enabled: true
    size: 20Gi

  ## @param prometheus.resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if prometheus.resources is set (prometheus.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "xlarge"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""
  
  #additionalPrometheusRules: []

kube-state-metrics:
  resourcesPreset: "none"
  nodeSelector:
    nexops-tools: "yes"

alertmanager:
  nodeSelector:
    nexops-tools: "yes"
  resourcesPreset: "none"
  enabled: true
  config:
    global:
      resolve_timeout: 15m
      http_config:
        proxy_url: "http://iusqd-uat.gamora.prod:8801"

    route:
      receiver: default-receiver
      routes:
      - receiver: 'null'
        match_re:
         namespace: "l1|l2|gn|hd|sk|sp|tg|mg|cattle-system"
         alertname: "Kubernetes Service.*"
      - receiver: 'null'
        matchers:
        - namespace=~"l1|l2|gn|hd|sk|sp|tg|mg|cattle-system"
        - component="kubernetes"
      - receiver: 'alert-nx-atomix'
        match_re:
          alertname: "Kubernetes Cluster Pod Usage Above 80%"
      - receiver: 'alert-nx-atomix-uat'
        match_re:
          alertname: "Kubernetes.*"
      - receiver: "alert-velero-backups"
        match_re:
          alertname: "Velero.*"
      - receiver: kubescape-notify
        matchers:
        - alertname="KubescapeRuleViolated"
        - severity!="low"
        group_by: ['container_name', 'rule_name']
      group_by: ['alertname', 'cluster', 'namespace', 'pod', 'description']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h

    receivers:
    - name: 'null'
    - name: 'alert-nx-atomix-uat'
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: '#alert-nx-atomix-uat'
        send_resolved: true
        icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
        title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
        text: |
          *Cluster:* `Kubernetes-SC-KLUAT`
          *Summary:* `{{ .CommonLabels.alertname }}`
          *Description:* `{{ .CommonAnnotations.description }}`
        color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'
    
    - name: 'alert-nx-atomix'
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: '#alert-nx-atomix'
        send_resolved: true
        icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
        title: '{{ if eq .Status "firing" }} 🔥 PROBLEM 🔥 {{ else }} ✅ RESOLVED ✅ {{ end }}'
        text: |
          *Cluster:* `Kubernetes-SC-KLUAT`
          *Summary:* `{{ .CommonLabels.alertname }}`
          *Description:* `{{ .CommonAnnotations.description }}`
        color: '{{ if eq .Status "firing" }}#FF4500{{ else }}#2ECC71{{ end }}'

    - name: "alert-velero-backups"
      slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#alert-velero-backups"
        send_resolved: true
        icon_emoji: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }}'
        title: '{{ if eq .Status "firing" }}🔥 PROBLEM 🔥 {{ .CommonLabels.alertname }}{{ else }}✅ RESOLVED ✅ {{ .CommonLabels.alertname }}{{ end }}'
        text: |
          *Cluster:* `Kubernetes-SC-KLUAT`
          ❗ *{{ .CommonLabels.severity }}*
          📝 *{{ .CommonAnnotations.message }}*

    - name: kubescape-notify
      slack_configs:
      - channel: "#dev-services"
        color: '{{ template "sre.slack.color" . }}'
        fallback: '{{ template "sre.slack.fallback" . }}'
        icon_emoji: '{{ template "sre.slack.iconemoji" . }}'
        send_resolved: false
        username: '{{ template "sre.slack.username" . }}🔹SC.UAT'
        title: '{{ template "kubescape.slack.title" . }}'
        text: '{{ template "sre.slack.body" . }}'

    - name: default-receiver

node-exporter:
  resourcesPreset: "medium"

blackboxExporter:
  nodeSelector:
    nexops-tools: "yes"
