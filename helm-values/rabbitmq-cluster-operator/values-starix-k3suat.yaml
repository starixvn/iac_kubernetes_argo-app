global:
  storageClass: longhorn
  storageSize: 15Gi

rabbitCluster:
  user: admin
  password: rabbitadmin!@
  resources:
    maxMemory: 3Gi

  service:
    amqp:
      nodePort: 30672
    manager:
      nodePort: 31672


  nodeSelector:
  #  rabbit: "yes"
  tolerations:
    - key: rabbit-deployapi
      operator: "Equal"
      value: "yes"
      effect: "NoSchedule"

  metrics:
    serviceMonitor:
      enabled: true

clusterOperator:
  nodeSelector:
    rabbit: "yes"
  tolerations:
    - key: rabbit-deployapi
      operator: "Equal"
      value: "yes"
      effect: "NoSchedule"

msgTopologyOperator:
  nodeSelector:
    rabbit: "yes"
  tolerations:
    - key: rabbit-deployapi
      operator: "Equal"
      value: "yes"