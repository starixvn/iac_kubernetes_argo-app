clusterDomain: "starix.k3ssit"


image:
  registry: nexhub.ops-sit.nebula.sit
  repository: kbt/base/bitnamilegacy/haproxy
  tag: 3.0.4-debian-12-r2




# setting HA for service
replicaCount: 3
podAntiAffinityPreset: hard
resources:
  requests:
    memory: 2Gi
  limits:
    memory: 2Gi
# priorityClassName: "critical-service"
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

updateStrategy:
  ## StrategyType
  ## Can be set to RollingUpdate or OnDelete
  ##
  type: Recreate


service:
  type: LoadBalancer
  loadBalancerIP: "172.16.4.93"
  ports:
#NAP
  - name: redis-nap-m
    protocol: TCP
    port: 16777
    targetPort: redis-nap-m


  - name: http
    port: 8080
    targetPort: http

  #NAP-Session-State
  - name: session-state
    protocol: TCP
    port: 42424
    targetPort: session-state

containerPorts:
#NAP
- name: redis-nap-m
  containerPort: 16777

- name: http
  containerPort: 8080

- name: session-state
  containerPort: 42424

configuration: |
  global
    log stdout format raw local0
    maxconn 10240

  defaults
    log global
    timeout client 360s
    timeout connect 360s
    timeout server 360s

  resolvers k8s
    nameserver dns1 kube-dns.kube-system:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s

  frontend fe_main
    bind :8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    default_backend default_backend_nodes

  backend default_backend_nodes
    mode http
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake... K3s SIT"

  frontend redis_nap_master_fe
    bind :16777
    default_backend redis_nap_master_be


  backend redis_nap_master_be
    option tcp-check
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis-0 redis-nap-repl-0.redis-nap-repl-headless.tf-stx-redis-nap.svc.starix.k3ssit:6379 check inter 1s resolvers k8s init-addr none
    server redis-1 redis-nap-repl-1.redis-nap-repl-headless.tf-stx-redis-nap.svc.starix.k3ssit:6379 check inter 1s resolvers k8s init-addr none
    server redis-2 redis-nap-repl-2.redis-nap-repl-headless.tf-stx-redis-nap.svc.starix.k3ssit:6379 check inter 1s resolvers k8s init-addr none
  
  #NAP-Session-State
  frontend nap_session_state_fe
    bind :42424
    option tcplog
    mode tcp
    default_backend nap_asp_state_be

  backend nap_asp_state_be
    mode tcp
    option tcplog
    option tcp-check
    default-server inter 2s fall 5 rise 5
    server state_4_65_42424 172.16.4.65:42424 check
    server state_4_66_42424 172.16.4.66:42424 check backup

 