clusterDomain: "kc-starix.testlab"

# setting HA for service
replicaCount: 3


image:
  registry: hub.nexdev.net
  repository: base/bitnamilegacy/haproxy
  tag: 3.0.4-debian-12-r2


updateStrategy:
  ## StrategyType
  ## Can be set to RollingUpdate or OnDelete
  ##
  type: Recreate


service:
  type: LoadBalancer
  loadBalancerIP: "10.70.70.72"
  ports:

#NAP
  - name: redis-nap-m
    protocol: TCP
    port: 16777
    targetPort: redis-nap-m

  - name: redis-nap-r
    protocol: TCP
    port: 16778
    targetPort: redis-nap-r

  - name: http
    port: 8080
    targetPort: http

containerPorts:
  - name: redis-nap-m
    containerPort: 16777

  - name: redis-nap-r
    containerPort: 16778

  - name: http
    containerPort: 8080


configuration: |
  global
    log stdout format raw local0
    maxconn 10240

  defaults
    log global
    timeout client 360s
    timeout connect 360s
    timeout server 360s

  resolvers k8s
    nameserver dns1 kube-dns.kube-system:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 30s

  frontend fe_main
    bind :8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    default_backend default_backend_nodes

  backend default_backend_nodes
    mode http
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake... K3s KC Testlab"

  frontend redis_nap_master_fe
    bind :16777
    default_backend redis_nap_master_be

  backend redis_nap_master_be
    option tcp-check
    tcp-check send AUTH\ redisPassword123!\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK

    server redis-0 redis-nap-repl-0.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none
    server redis-1 redis-nap-repl-1.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none
    server redis-2 redis-nap-repl-2.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none

  frontend redis_nap_rep_fe
    bind :16778
    default_backend redis_nap_rep_be

  backend redis_nap_rep_be
    option tcp-check
    tcp-check send AUTH\ redisPassword123!\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string PONG
    tcp-check send QUIT\r\n
    tcp-check expect string +OK

    server redis-0 redis-nap-repl-0.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none
    server redis-1 redis-nap-repl-1.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none
    server redis-2 redis-nap-repl-2.redis-nap-repl-headless.redis-kc.svc.kc-starix.testlab:6379 check inter 1s resolvers k8s init-addr none




