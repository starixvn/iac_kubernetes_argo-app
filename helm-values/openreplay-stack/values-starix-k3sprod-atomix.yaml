fromVersion: "v1.22.0"
skipMigration: true

tags:
  db: true
  app: true


databases:
  postgresql:
    fullnameOverride: openreplay-postgresql
    image:
      registry: nexhub.ops-klprod.gamora.prod
      repository: kbt/base/bitnami/postgresql
      tag: 17.4.0-debian-12-r13
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 4000Mi
    master:
      nodeSelector:
        open-replay: "yes"
      tolerations:
      - key: "open-replay"
        value: "yes"
        effect: "NoSchedule"
    persistence:
      size: 30Gi
      storageClass: "longhorn-effort-2rep"

  minio:
    enabled: false
  redis:
    image:
      registry: nexhub.ops-klprod.gamora.prod
      repository: kbt/base/bitnami/redis
      tag: 7.2.5-debian-12-r4
    fullnameOverride: openreplay-redis
    usePassword: false
    cluster:
      enabled: false
    master:
      nodeSelector:
        open-replay: "yes"
      tolerations:
      - key: "open-replay"
        value: "yes"
        effect: "NoSchedule"
      persistence:
        size: 10Gi
        storageClass: "longhorn-effort-2rep"


  clickhouse:
    enabled: true
    fullnameOverride: "openreplay-clickhouse"
    nameOverride: "openreplay-clickhouse"
    image:
      repository: nexhub.ops-klprod.gamora.prod/kbt/base/clickhouse/clickhouse-server
      tag: "25.1-alpine"
    backupImage:
      repository: nexhub.ops-klprod.gamora.prod/kbt/base/alexakulov/clickhouse-backup
      pullPolicy: IfNotPresent
      tag: "latest"
    nodeSelector:
      open-replay: "yes"
    tolerations:
    - key: "open-replay"
      value: "yes"
      effect: "NoSchedule"
  storageSize: 50Gi
  storageClass: "longhorn-stricted"

openreplay:
  # skipMigration: true
  ingress-nginx:
    enabled: false

  connector:
    enabled: false

  quickwit:
    enbled: false
    image:
      repository: nexhub.ops-klprod.gamora.prod/kbt/base/quickwit/quickwit
      pullPolicy: IfNotPresent
      tag: "latest"

  global:
    clusterDomain: "svc.starix.k3sprod"

  chalice:
    env:
      CH_COMPRESSION: "false"
      SKIP_H_SSL: true
      CLUSTER_URL: "svc.starix.k3sprod"
    replicaCount: 2
    nodeSelector:
      open-replay: "yes"
    tolerations:
    - effect: NoSchedule
      key: open-replay
      value: "yes"    

