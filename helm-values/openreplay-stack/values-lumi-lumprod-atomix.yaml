fromVersion: "v1.22.0"

tags:
  db: true
  app: true


databases:
  postgresql:
    fullnameOverride: openreplay-postgresql
    image:
      registry: hub.nexdev.net
      repository: base/bitnami/postgresql
      tag: 17.4.0-debian-12-r13
  minio:
    enabled: false
  redis:
    image:
      registry: hub.nexdev.net
      repository: base/bitnami/redis
      tag: 7.2.5-debian-12-r4
    fullnameOverride: openreplay-redis
    usePassword: false
    cluster:
      enabled: false
    redis:
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 128Mi
  clickhouse:
    enabled: true
    fullnameOverride: "openreplay-clickhouse"
    nameOverride: "openreplay-clickhouse"
    image:
      repository: hub.nexdev.net/base/clickhouse/clickhouse-server
      tag: "25.1-alpine"
    backupImage:
      repository: hub.nexdev.net/base/alexakulov/clickhouse-backup
      pullPolicy: IfNotPresent
      tag: "latest"

openreplay:
  ingress-nginx:
    enabled: false



clickhouse: &clickhouse
  enabled: true
  chHost: clickhouse-openreplay-clickhouse
  username: default
  password: ""
  service:
    webPort: 9000
    dataPort: 8123

kafka: &kafka
  enabled: false

redis: &redis
  enabled: true
  redisHost: "openreplay-redis-master"
  redisPort: "6379"

minio:
  # Disable this if you use an external object storage service (s3)
  enabled: false
  global:
    minio:
      accessKey: &accessKey "openreplay"
      secretKey: &secretKey "8~Hb2+_210l$1IzXZxc"

# For enterpriseEdition
quickwit: &quickwit
  enabled: false


# For enterpriseEdition
connector: &connector
  enabled: false

postgresql: &postgres
  postgresqlPassword: "super-secure-password"
  postgresqlHost: "openreplay-postgresql"
  postgresqlPort: "5432"
  postgresqlUser: "postgres"
  postgresqlDatabase: "postgres"

ingress: &haproxy-ingress
  className: "haproxy"
  controller:
    ingressClassResource:
      name: "haproxy"
    ingressClassName: "haproxy"
    ingressClass: haproxy


global:
  ingress: *haproxy-ingress
  postgresql: *postgres
  kafka: *kafka
  redis: *redis
  quickwit: *quickwit
  clickhouse: *clickhouse
  connector: *connector
  openReplayContainerRegistry: "public.ecr.aws/p1t3u8a3"
  assistKey: "p^qVt8cfqp-YyP6Cb?lI"
  assistJWTSecret: "p^qVt8cfqp-YyP6Cb?lI"
  jwtSecret: "p^qVt8cfqp-YyP6Cb?lI"
  jwtSpotSecret: "p^qVt8cfqp-YyP6Cb?lI"
  tokenSecret: "p^qVt8cfqp-YyP6Cb?lI"
  pvcRWXName: "openreplay-rwx"
  s3:
    region: "minio"
    endpoint: "https://s3-api.starixsoft.com"
    assetsBucket: "openreplay-sessions-assets"
    recordingsBucket: "openreplay-mobs"
    sourcemapsBucket: "openreplay-sourcemaps"
    spotsBucket: "openreplay-spots"
    # if you're using one node installation, where
    # you're using local s3, make sure these variables
    # are same as minio.global.minio.accesskey and  secretKey
    accessKey: *accessKey
    secretKey: *secretKey  
  domainName: "openreplay.lumigame.com"


chalice:
  env:
    JWT_REFRESH_SECRET: "p^qVt8cfqp-YyP6Cb?lI"
    JWT_SPOT_REFRESH_SECRET: "p^qVt8cfqp-YyP6Cb?lI"

