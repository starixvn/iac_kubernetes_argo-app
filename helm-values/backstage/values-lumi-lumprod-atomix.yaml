global:
  imageRegistry: ""
  imagePullSecrets: []

kubeVersion: ""

nameOverride: ""

fullnameOverride: ""

clusterDomain: cluster.local

commonLabels: {}

commonAnnotations: {}

extraDeploy: []

diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity
ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  host: "backstage.lumigame.com"
  extraHosts: []
  path: "/"
  tls:
    enabled: false
    secretName: ""
  extraTls: []

backstage:
  replicas: 1
  revisionHistoryLimit: 10

  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  pdb:
    create: false
    minAvailable: ""
    maxUnavailable: ""
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  
  containerPorts:
    backend: 7007
  
  command: ["node", "packages/backend"]
  
  args: []

  extraAppConfig: []

  extraContainers: []

  extraEnvVars: []
    # - name: APP_CONFIG_app_baseUrl
    #   value: "https://backstage.lumigame.com"
    # - name: APP_CONFIG_backend_baseUrl
    #   value: "https://backstage.lumigame.com"
    # - name: APP_CONFIG_backend_cors_origin
    #   value: "https://backstage.lumigame.com"

  extraEnvVarsCM: []

  extraEnvVarsSecrets: []

  extraPorts: []

  extraVolumeMounts: []

  extraVolumes: []

  initContainers: []

  installDir: /app

  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 250Mi
      cpu: 100m

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  podSecurityContext: {}

  containerSecurityContext: {}

  appConfig:
    app:
      baseUrl: "https://backstage.lumigame.com"
      title: "Backstage"
    
    backend:
      baseUrl: "https://backstage.lumigame.com"
      listen:
        port: 7007
        host: "0.0.0.0"
      cors:
        origin: "https://backstage.lumigame.com"
      csp:
        connect-src: ["'self'", "http:", "https:"]

    database:
      client: "pg"
      connection:
        host: "postgresql"
        port: 5432
        user: "bn_backstage"
        password: "password"
        database: "backstage"

  affinity: {}

  topologySpreadConstraints: []

  nodeSelector: {}

  tolerations: []

service:
  type: ClusterIP
  ports:
    backend: 7007
    name: http-backend
    targetPort: backend
  #nodePorts:
  #  backend: 32707

postgresql:
  enabled: true
  auth:
    username: bn_backstage
    password: "password"
    database: "backstage"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: admin-password
      userPasswordKey: user-password
      replicationPasswordKey: replication-password
  architecture: standalone
  persistence:
    enabled: true
    size: "8Gi"
    storageClass: "longhorn"

# -- Service Account Configuration
# @default -- See below
serviceAccount:

  # -- Enable the creation of a ServiceAccount for Backstage pods
  create: false

  # -- Name of the ServiceAccount to use
  # If not set and `serviceAccount.create` is true, a name is generated
  name: ""

  # -- Additional custom labels to the service ServiceAccount.
  labels: {}

  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Auto-mount the service account token in the pod
  automountServiceAccountToken: true
