global:
  imageRegistry: ""
  imagePullSecrets: []

kubeVersion: ""

nameOverride: ""

fullnameOverride: ""

clusterDomain: cluster.local

commonLabels: {}

commonAnnotations: {}

extraDeploy: []

diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity
ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  host: "backstage.lumigame.com"
  extraHosts: []
  path: "/"
  tls:
    enabled: false
    secretName: ""
  extraTls: []

backstage:
  replicas: 1
  revisionHistoryLimit: 10

  image:
    registry: hub.lumigame.com
    repository: base/backstage
    tag: v3
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  pdb:
    create: false
    minAvailable: ""
    maxUnavailable: ""
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  
  containerPorts:
    backend: 7007
  
  command: ["node", "packages/backend"]
  
  args: []

  extraAppConfig: []

  extraContainers: []

  extraEnvVars:
    - name: GITLAB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: gitlab-client-id
    - name: GITLAB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: gitlab-client-secret
    - name: GITLAB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: gitlab-token

  extraEnvVarsCM: []

  extraEnvVarsSecrets: []

  extraPorts: []

  extraVolumeMounts: []

  extraVolumes: []

  initContainers: []

  installDir: /app

  # resources:
  #   limits:
  #     memory: 1Gi
  #     cpu: 1000m
  #   requests:
  #     memory: 250Mi
  #     cpu: 100m

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  podSecurityContext: {}

  containerSecurityContext: {}

  appConfig:
    app:
      title: SC Developer Portal
      baseUrl: https://backstage.lumigame.com

    backend:
      baseUrl: https://backstage.lumigame.com
      listen:
        port: 7007
        host: "0.0.0.0"
      cors:
        origin: https://backstage.lumigame.com
    database:
      client: pg
      connection:
        host: backstage-atx-lumprod-postgresql.backstage.svc
        port: 5432
        user: bn_backstage
        password: backstage1qaz@WSX
        database: backstage

    integrations:
      gitlab:
        - host: "gitlab.nexdev.net"
          apiBaseUrl: "https://gitlab.nexdev.net/api/v4"
          token: ${GITLAB_TOKEN}

    auth:
      environment: development
      providers:
        gitlab:
          development:
            clientId: ${GITLAB_CLIENT_ID}
            clientSecret: ${GITLAB_CLIENT_SECRET}
            audience: "https://gitlab.nexdev.net"
            callbackUrl: "https://backstage.lumigame.com/api/auth/gitlab/handler/frame"
            authorizationUrl: "https://gitlab.nexdev.net/oauth/authorize"
            tokenUrl: "https://gitlab.nexdev.net/oauth/token"
            signIn:
              resolvers:
                - resolver: "usernameMatchingUserEntityName"

    catalog:
      providers:
        backstageOpenapi:
          plugins:
            - catalog
            - search
      rules:
        - allow: [Component, API, Location, Template]
      locations: 
        - type: url
          target: https://gitlab.nexdev.net/dennis.le/backstage/-/blob/main/packages/catalog-model/examples/components/artist-lookup-component.yaml
          rules:
            - allow: [Group]
      processing:
        interval:
          seconds: 30

    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'

    kubernetes:
      serviceLocatorMethod:
        type: 'multiTenant'
      clusterLocatorMethods:
        - type: 'config'
          clusters:
            - url: kubernetes.default.svc.cluster.local:443
              name: local
              authProvider: 'serviceAccount'
              skipTLSVerify: false
              skipMetricsLookup: true
    

  affinity: {}

  topologySpreadConstraints: []

  nodeSelector: {}

  tolerations: []

service:
  type: ClusterIP
  ports:
    backend: 7007
    name: http-backend
    targetPort: backend

postgresql:
  image:
    registry: hub.lumigame.com
    repository: base/bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "15.4.0-debian-11-r45"
  enabled: true
  auth:
    username: bn_backstage
    password: "backstage1qaz@WSX"
    database: "backstage"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: admin-password
      userPasswordKey: user-password
      replicationPasswordKey: replication-password
  architecture: standalone
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: "longhorn"

serviceAccount:
  create: true
  name: ""
  labels: {}
  annotations: {}
  automountServiceAccountToken: true
