global:
  imageRegistry: ""
  imagePullSecrets: []

kubeVersion: ""

nameOverride: ""

fullnameOverride: ""

clusterDomain: cluster.local

commonLabels: {}

commonAnnotations: {}

extraDeploy: []

diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity
ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  host: "backstage.lumigame.com"
  extraHosts: []
  path: "/"
  tls:
    enabled: false
    secretName: ""
  extraTls: []

backstage:
  replicas: 1
  revisionHistoryLimit: 10

  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  pdb:
    create: false
    minAvailable: ""
    maxUnavailable: ""
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  
  containerPorts:
    backend: 7007
  
  command: ["node", "packages/backend"]
  
  args: []

  extraAppConfig: []

  extraContainers: []

  extraEnvVars: []

  extraEnvVarsCM: []

  extraEnvVarsSecrets: []

  extraPorts: []

  extraVolumeMounts: []

  extraVolumes: []

  initContainers: []

  installDir: /app

  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 250Mi
      cpu: 100m
  #resources: {}

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  podSecurityContext: {}

  containerSecurityContext: {}

  appConfig: {}

  affinity: {}

  topologySpreadConstraints: []

  nodeSelector: {}

  tolerations: []

service:
  type: nodePorts #ClusterIP
  ports:
    backend: 7007
    name: http-backend
    targetPort: backend
  nodePorts:
    backend: 32707

postgresql:
  enabled: false

  # -- The authentication details of the Postgres database
  auth:

    # -- Name for a custom user to create
    username: bn_backstage

    # -- Password for the custom user to create
    password: ""

    # -- Name of existing secret to use for PostgreSQL credentials
    existingSecret: ""

    # -- The secret keys Postgres will look for to retrieve the relevant password
    secretKeys:

      # -- The key in which Postgres will look for, for the admin password, in the existing Secret
      adminPasswordKey: admin-password

      # -- The key in which Postgres will look for, for the user password, in the existing Secret
      userPasswordKey: user-password

      # -- The key in which Postgres will look for, for the replication password, in the existing Secret
      replicationPasswordKey: replication-password

  # -- PostgreSQL architecture (`standalone` or `replication`)
  architecture: standalone

# -- Service Account Configuration
# @default -- See below
serviceAccount:

  # -- Enable the creation of a ServiceAccount for Backstage pods
  create: false

  # -- Name of the ServiceAccount to use
  # If not set and `serviceAccount.create` is true, a name is generated
  name: ""

  # -- Additional custom labels to the service ServiceAccount.
  labels: {}

  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Auto-mount the service account token in the pod
  automountServiceAccountToken: true
