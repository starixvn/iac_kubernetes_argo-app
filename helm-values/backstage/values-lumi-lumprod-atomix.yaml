global:
  imageRegistry: ""
  imagePullSecrets: []

kubeVersion: ""

nameOverride: ""

fullnameOverride: ""

clusterDomain: cluster.local

commonLabels: {}

commonAnnotations: {}

extraDeploy: []

diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity
ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  host: "backstage.lumigame.com"
  extraHosts: []
  path: "/"
  tls:
    enabled: false
    secretName: ""
  extraTls: []

backstage:
  replicas: 1
  revisionHistoryLimit: 10

  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: latest
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  pdb:
    create: false
    minAvailable: ""
    maxUnavailable: ""
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  
  containerPorts:
    backend: 7007
  
  command: ["node", "packages/backend"]
  
  args: []

  extraAppConfig: []

  extraContainers: []

  extraEnvVars:
    - name: GITLAB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: gitlab-token

  extraEnvVarsCM: []

  extraEnvVarsSecrets: []

  extraPorts: []

  extraVolumeMounts: []

  extraVolumes: []

  initContainers: []

  installDir: /app

  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 250Mi
      cpu: 100m

  readinessProbe:
    httpGet:
      path: /.backstage/health/v1/readiness
      port: 7007
      scheme: HTTP

  livenessProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  startupProbe:
    httpGet:
      path: /.backstage/health/v1/liveness
      port: 7007
      scheme: HTTP

  podSecurityContext: {}

  containerSecurityContext: {}

  appConfig:
    app:
      title: Lumigame Developer Portal
      baseUrl: https://backstage.lumigame.com

    backend:
      baseUrl: https://backstage.lumigame.com
      listen:
        port: 7007
      cors:
        origin: https://backstage.lumigame.com
      database:
        client: pg
        connection:
          host: backstage-postgresql
          port: 5432
          user: bn_backstage
          password: backstage1qaz@WSX
          database: backstage

    integrations:
      gitlab:
        - host: git3-bk.nexdev.net
          apiBaseUrl: https://git3-bk.nexdev.net/api/v4
          token:
            $env: GITLAB_TOKEN
    

  affinity: {}

  topologySpreadConstraints: []

  nodeSelector: {}

  tolerations: []

service:
  type: ClusterIP
  ports:
    backend: 7007
    name: http-backend
    targetPort: backend
  #nodePorts:
  #  backend: 32707

postgresql:
  image:
    registry: hub.lumigame.com
    repository: base/bitnami/postgresql
    pullPolicy: IfNotPresent
    tag: "15.4.0-debian-11-r45"
  enabled: true
  auth:
    username: bn_backstage
    password: "backstage1qaz@WSX"
    database: "backstage"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: admin-password
      userPasswordKey: user-password
      replicationPasswordKey: replication-password
  architecture: standalone
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: "longhorn"

# -- Service Account Configuration
# @default -- See below
serviceAccount:

  # -- Enable the creation of a ServiceAccount for Backstage pods
  create: false

  # -- Name of the ServiceAccount to use
  # If not set and `serviceAccount.create` is true, a name is generated
  name: ""

  # -- Additional custom labels to the service ServiceAccount.
  labels: {}

  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Auto-mount the service account token in the pod
  automountServiceAccountToken: true
