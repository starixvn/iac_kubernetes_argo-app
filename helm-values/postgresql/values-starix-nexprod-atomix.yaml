global:
  defaultStorageClass: "longhorn-effort"
clusterDomain: starix.nexprod

image:
  registry: hub.nexdev.net
  repository: base/bitnami/postgresql
  tag: 15.3.0-debian-11-r85



primary:
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2048Mi
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "longhorn-effort"
  nodeSelector:
    sonar: "yes"
  tolerations:
  - effect: NoSchedule
    key: cicd-tools
    value: "yes"

  pgHbaConfiguration: |-
    local all all trust
    host all all localhost trust
    host all all all md5


  # podSecurityContext:
  #   enabled: false
  # containerSecurityContext:
  #   enabled: true
  #   runAsUser: 0
  #   runAsNonRoot: false