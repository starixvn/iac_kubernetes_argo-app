image:
  repository: influxdb
  tag: 2.7.4-alpine
  pullPolicy: IfNotPresent
podAnnotations: {}
podLabels: {}

nameOverride: ""
fullnameOverride: ""

resources:
  limits:
   cpu: 100m
   memory: 128Mi
  requests:
   cpu: 100m
   memory: 128Mi

nodeSelector: {}
tolerations: []

affinity: {}

securityContext: {}
livenessProbe: {}


readinessProbe: {}

startupProbe:
  enabled: false
env: {}
adminUser:
  organization: "nexdev"
  bucket: "test"
  user: "admin"
  retention_policy: "0s"
  password: "RO5YrPwFsEgmcLzYR5NHJJdeC1qXaqzK"
  token: "mVOxEhnn1B5ilYbkqdlZr9BiAeFqtpjf"
persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: 50Gi
  mountPath: /var/lib/influxdb2

initScripts:
  enabled: false
  scripts:
    init.sh: |+
      #!/bin/bash
      influx apply --force yes -u https://raw.githubusercontent.com/influxdata/community-templates/master/influxdb2_operational_monitoring/influxdb2_operational_monitoring.yml
service:
  type: NodePort
  port: 80
  targetPort: 8086
  nodePort: 30086
  annotations: {}
  labels: {}
  portName: http

serviceAccount:
  create: true
  name:
  annotations: {}

ingress:
  enabled: false
  tls: false
  hostname: influxdb.nexdev.net
  annotations: {}
  path: /

pdb:
  create: true
  minAvailable: 1