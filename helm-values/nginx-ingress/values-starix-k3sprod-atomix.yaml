controller:
  kind: DaemonSet
  image:
    registry: "nexhub.ops-klprod.gamora.prod"
    image:  "kbt/base/ingress-nginx/controller"
    tag: "v1.13.0"
    digest: ""
    digestChroot: ""
  
  config:
    strict-validate-path-type: "false"
    allow-snippet-annotations: "true"
    annotations-risk-level: "Critical"
  nodeSelector:
    open-replay: "yes"
  service:
    loadBalancerIP: "10.143.58.205"
    nodePorts:
      http: "32028"
      https: "31922"
  tolerations:
  - key: "open-replay"
    value: "yes"
    effect: "NoSchedule"
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 500Mi


