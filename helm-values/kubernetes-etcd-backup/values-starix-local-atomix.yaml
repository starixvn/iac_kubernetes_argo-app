backup:
  subdir: "/starix/local"
  dirname: "+etcd-backup-%FT%T%:z"
  expiretype: "days"
  keepdays: "3"
  keepcount: "5"
  schedule: "0 0 * * *"
  umask: "0027"

etcdConfiguration:
  endpoint: "10.17.200.80"
  insecureSkipTlsVerify: false

etcdCertification:
  etcdPeerTlsName: "etcd-peer-tls"
  etcdServerCaName: "etcd-server-ca"

persistence:
  reclaimPolicy: Retain
  capacity: 2Gi
  nfs:
    enabled: false
  provisioning:
    enabled: false
    storageClass: ""
  existingClaim: ""
  s3:
    enabled: true
    name: etcd-backup
    host: http://s3-api.starixsoft.com
    bucket: etcd-backups
    accessKey: etcd-backupper
    secretKey: h9giyAwIk6I7nUBh
    existingSecret: ""
    ca:
      enabled: false

image:
  repository: ghcr.io/adfinis/kubernetes-etcd-backup
  pullPolicy: Always
  tag: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsUser: 0               
  fsGroup: 0
  runAsGroup: 0

nodeSelector:
  etcd-backup: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

disableDefaultEtcdMounts: true

extraVolumes:
  - name: etcd-member-certs
    secret:
      secretName: etcd-member-certs

extraVolumeMounts:
  - name: etcd-member-certs
    mountPath: /etc/ssl/etcd/ssl/ca.pem
    subPath: ca.pem
    readOnly: true
  - name: etcd-member-certs
    mountPath: /etc/ssl/etcd/ssl/member-k8snode-17-80.spvn.local.pem
    subPath: member.pem
    readOnly: true
  - name: etcd-member-certs
    mountPath: /etc/ssl/etcd/ssl/member-k8snode-17-80.spvn.local-key.pem
    subPath: member-key.pem
    readOnly: true

env:
  - name: ETCDCTL_API
    value: "3"
  - name: ETCDCTL_ENDPOINTS
    value: "https://10.17.200.80:2379"
  - name: ETCDCTL_CACERT
    value: "/etc/ssl/etcd/ssl/ca.pem"
  - name: ETCDCTL_CERT
    value: "/etc/ssl/etcd/ssl/member-k8snode-17-80.spvn.local.pem"
  - name: ETCDCTL_KEY
    value: "/etc/ssl/etcd/ssl/member-k8snode-17-80.spvn.local-key.pem"