backup:
  subdir: "/starix/local"
  dirname: "+etcd-backup-%FT%T%:z"
  expiretype: "days"
  keepdays: "3"
  keepcount: "5"
  schedule: "0 0 * * *"
  umask: "0027"

etcdConfiguration:
  endpoint: "10.17.200.80"
  insecureSkipTlsVerify: false

etcdCertification:
  etcdPeerTlsName: "etcd-peer-tls"
  etcdServerCaName: "etcd-server-ca"

persistence:
  reclaimPolicy: Retain
  capacity: 2Gi
  nfs:
    enabled: false
  provisioning:
    enabled: false
    storageClass: ""
  existingClaim: ""
  s3:
    enabled: true
    name: etcd-backup
    host: http://s3-api.starixsoft.com
    bucket: etcd-backups
    accessKey: etcd-backupper
    secretKey: h9giyAwIk6I7nUBh
    existingSecret: ""
    ca:
      enabled: false

image:
  repository: ghcr.io/adfinis/kubernetes-etcd-backup
  pullPolicy: Always
  tag: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsUser: 0               
  fsGroup: 0
  runAsGroup: 0

nodeSelector:
  etcd-backup: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
