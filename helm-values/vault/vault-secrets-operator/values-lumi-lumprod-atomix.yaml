---
controller:
  replicas: 1
  manager:
    image:
      pullPolicy: IfNotPresent
      repository: hub.lumigame.com/base/hashicorp/vault-secrets-operator

manager:
  kubernetesClusterDomain: starix.nexprod
    

metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  type: ClusterIP

defaultVaultConnection:
  enabled: true
  address: "http://vault-atx-lumprod-active:8200"
  skipTLSVerify: true
