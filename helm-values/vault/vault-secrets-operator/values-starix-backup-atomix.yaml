---
controller:
  replicas: 1
  manager:
    image:
      pullPolicy: IfNotPresent
      repository: hub.nexdev.net/base/hashicorp/vault-secrets-operator

manager:
  kubernetesClusterDomain: starix.backup

metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  type: ClusterIP

defaultVaultConnection:
  enabled: true
  address: "https://vault.nexdev.net"
  skipTLSVerify: true

###################################
# Persist Service Account Token
###################################
extraResources:
- |
  apiVersion: v1
  kind: Secret
  type: kubernetes.io/service-account-token
  metadata:
    name: {{ include "vso.chart.fullname" . }}-token
    namespace: {{ .Release.Namespace }}
    annotations:
      kubernetes.io/service-account.name: {{ include "vso.chart.fullname" . }}-controller-manager
    labels:
      app.kubernetes.io/component: controller-manager
    {{- include "vso.chart.labels" . | nindent 4 }}