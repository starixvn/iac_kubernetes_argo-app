image:
  repository: lumhub.ops-klprod.gamora.prod/kbt/base/tolgee
  pullPolicy: IfNotPresent
  tag: v3.11.6

ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  hosts:
    - host: tolgee-sc.sabagame.com
      paths:
        - path: /
          pathType: Prefix

service:
  type: NodePort
  port: 8080

postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: 13.5.0
  architecture: "standalone"
  auth:
    postgresPassword: "postgres"
    database: "postgres"
    username: "postgres"
    password: "postgres"
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: 32432
    persistence:
      enabled: true
      type: pvc
      size: 2Gi
      storageClass: longhorn

tolgee:
  # env:
  #   - name: SPRING_DATASOURCE_URL
  #     value: jdbc:postgresql://{{ include "tolgee.postgresql.fullname" . }}:5432/postgres
    # - name: SPRING_DATASOURCE_USERNAME
    #   value: postgres
    # - name: SPRING_DATASOURCE_PASSWORD
    #   value: "1qaz@WSX"
  persistence:
    enabled: true
    storageClass: longhorn
    size: 1Gi