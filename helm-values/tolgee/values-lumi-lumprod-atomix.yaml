image:
  repository: hub.lumigame.com/base/tolgee
  pullPolicy: IfNotPresent
  tag: latest

ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  hosts:
    - host: tolgee.lumigame.com
      paths:
        - path: /
          pathType: Prefix

service:
  type: NodePort
  port: 8080

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 13.5
  architecture: "standalone"
  auth:
    postgresPassword: "postgres"
    database: "postgres"
    username: "postgres"
    password: "postgres"
  primary:
    persistence:
      enabled: true
      type: pvc
      size: 2Gi
      storageClass: longhorn

tolgee:
  persistence:
    enabled: true
    storageClass: longhorn
    size: 1Gi