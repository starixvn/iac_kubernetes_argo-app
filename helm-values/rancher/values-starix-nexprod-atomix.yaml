---
replicas: 3

hostname: rancher.nexdev.net

agentTLSMode: system-store

tls: external
ingress:
  ingressClassName: haproxy

# privateCA: true

auditLog:
  image:
    repository: hub.nexdev.net/base/rancher/mirrored-bci-micro

rancherImage: hub.nexdev.net/base/rancher/rancher

postDelete:
  image:
    repository: hub.nexdev.net/base/rancher/shell


extraResources: []

ldap:
  enabled: true
  # `existingSecret` is a reference to an existing secret containing the ldap configuration
  # for Grafana in a key `ldap-toml`.
  existingSecret: ""
  # `config` is the content of `ldap.toml` that will be stored in the created secret
  # config: ""
  config: |-
    verbose_logging = true

    [[servers]]
    host = "10.18.200.100"
    port = 389
    use_ssl = false
    start_tls = false
    ssl_skip_verify = false
    bind_dn = "CN=Owen Dang,OU=UsersGroups,OU=Nexops,OU=Atomix,OU=Workstations,OU=NEXSOL,DC=spvn,DC=local"