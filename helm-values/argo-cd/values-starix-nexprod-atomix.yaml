---
# Running with Argo-CD Helm Chart version 9.1.4
global:
  domain: argocd.nexdev.net
  image: 
    repository: hub.nexdev.net/base/argoproj/argocd
  nodeSelector:
    argocd: "yes"
  tolerations:
  - key: cattle.io/os
    value: argocd
    operator: Equal
    effect: NoSchedule
  affinity: {}

configs:
  cm:
    accounts.nexops: apiKey
    accounts.nexops.enabled: "true"
    accounts.nexpe: login,apiKey
    timeout.reconciliation: 360s
    resource.exclusions: |
      ### KubeScape crds resource sync
      - apiGroups:
        - "spdx.softwarecomposition.kubescape.io"
        kinds:
        - "*"
        clusters:
        - https://alp-api-dr.starixplay.com:16445
        - https://st-api-dr.starixplay.com:16444
        - https://10.17.200.90:6443
      ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - Endpoints
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
  params:
    application.namespaces: "argocd*"
    server.insecure: true
    controller.kubectl.parallelism.limit: "50"
    controller.operation.processors: "200"
    controller.status.processors: "100"
  tls:
    create: true

redis-ha:
  enabled: true
  dynamicClusterDistribution: false

controller:
  replicas: 3

server:
  replicas: 3
  ingress:
    enabled: true
    ingressClassName: haproxy
    extraHosts: []
  clusterRoleRules:
    enabled: false
    rules: []

repoServer:
  replicas: 3

applicationSet:
  replicas: 1
